 ex:"If two sperm got in, the zygote would have 69 chromosomes (23 + 23 + 23) and would not develop properly. The membrane change locks out the others."},
{id:"hu12",t:"human",s:"ii",type:"mcq",q:"Human body cells have 46 chromosomes. How many does a <b>sperm cell</b> have, and why?",
 o:["23, so that when it fuses with an egg (23) the zygote has 46","46, because it is a human cell","92, because it needs extra to swim","23, because the other 23 are in its tail"],a:0,
 ex:"Gametes have <b>half</b> the chromosomes. 23 + 23 = 46 in the zygote, so the number stays the same every generation."},
{id:"hu13",t:"human",s:"ii",type:"mcq",q:"In an operation called a vasectomy, both <b>sperm ducts</b> are cut and tied. <b>Predict</b> the result.",
 o:["Semen is still released but it contains no sperm, so it cannot fertilise an egg","The man can no longer make testosterone","The testes stop making semen fluid","Sperm leave the body through the bladder instead"],a:0,
 ex:"The sperm ducts carry sperm from the testes to the urethra. Cut them and the sperm cannot reach the urethra, but the prostate and seminal vesicles still add fluid, so semen has no sperm. Testes still make testosterone (it travels in the blood, not the ducts)."},
{id:"hu14",t:"human",s:"ii",type:"mcq",q:"A woman ovulates normally every month, but both of her oviducts are blocked. Why can’t she become pregnant naturally?",
 o:["Sperm cannot reach the egg, and the egg cannot reach the uterus, so fertilisation cannot happen","Her ovaries cannot make eggs","Her uterus lining cannot thicken","Her cervix will not open"],a:0,
 ex:"The oviduct is where sperm and egg meet. Blocked oviducts = no meeting = no fertilisation. (IVF gets around this by fertilising the egg outside the body and placing the embryo in the uterus.)"},
{id:"hu15",t:"human",s:"i",type:"multi",q:"Select <b>ALL</b> the cells that are <b>gametes</b>.",
 o:["Sperm cell","Egg cell (ovum)","Zygote","Skin cell","The male gamete inside a pollen grain","Embryo"],a:[0,1,4],
 ex:"A gamete is a <b>sex cell</b>. A zygote is what forms <i>after</i> two gametes fuse, so it is not a gamete. An embryo is many cells. Plants have gametes too: the male one is carried in the pollen grain, the female one is in the ovule."},
{id:"hu16",t:"human",s:"ii",type:"mcq",q:"In some boys the testes stay inside the body instead of moving down into the scrotum. Suggest why, if untreated, this can lead to fewer healthy sperm.",
 o:["The testes are too warm inside the body; sperm are made best slightly below body temperature","The testes cannot get oxygen inside the body","Sperm cannot swim inside the body","The sperm ducts are too long"],a:0,
 ex:"Apply the function of the scrotum: it keeps the testes a few degrees cooler. Inside the body is too warm for healthy sperm production."},
{id:"hu17",t:"human",s:"i",type:"mcq",q:"Which statement about the <b>urethra</b> in males is correct?",
 o:["It carries both urine and semen out of the body, but not at the same time","It carries sperm from the testes to the prostate","It only carries urine","It makes semen"],a:0,
 ex:"The urethra is shared. The sperm ducts carry sperm from the testes to the urethra."},
{id:"hu18",t:"human",s:"i",type:"written",q:"<b>Describe</b> how a sperm cell is adapted to its function. <span class='mk'>[5 marks]</span>",
 marks:[{p:"Tail (flagellum) to swim to the egg",k:["tail|flagell","swim|move"]},
  {p:"Many mitochondria (middle section) release energy for swimming",k:["mitochond","energy|respir"]},
  {p:"Acrosome with enzymes that digest/break down the egg’s outer layer so the sperm can enter",k:["acrosome|enzyme","digest|break|penetrat|enter|get in"]},
  {p:"Streamlined shape to move easily / quickly",k:["streamlin|shape|thin|small"]},
  {p:"Nucleus has 23 chromosomes (half), so the zygote has 46",k:["23|half","chromosome"]}],
 model:"A sperm cell has a <b>tail</b> that whips from side to side so it can <b>swim</b> through the uterus to the egg in the oviduct. Its middle section has <b>many mitochondria</b>, which release the <b>energy</b> the tail needs. The head has an <b>acrosome</b> containing <b>enzymes</b> that digest the egg’s outer layer so the sperm can get in. It is small and <b>streamlined</b>, so it moves easily. Its nucleus contains only <b>23 chromosomes</b> (half the normal number), so when it fuses with an egg the zygote has the correct 46.",
 ex:"For a 7–8 ‘describe’, every feature must be linked to <b>what it does</b> and <b>why that helps</b>."},
// ---------------- MENSTRUAL CYCLE & FERTILISATION ----------------
{id:"cy1",t:"cycle",s:"i",type:"mcq",q:"What is <b>ovulation</b>?",
 o:["The release of a mature egg from an ovary","The breakdown and loss of the uterus lining","The joining of sperm and egg nuclei","The embryo embedding in the uterus lining"],a:0,
 ex:"The others are menstruation, fertilisation and implantation. Know all four definitions exactly."},
{id:"cy2",t:"cycle",s:"i",type:"order",q:"Put the stages in the correct order, from ovulation to implantation.",
 items:["A mature egg is released from the ovary","The egg moves along the oviduct while sperm swim up through the uterus","One sperm enters the egg","The sperm and egg nuclei fuse to form a zygote","The zygote divides into a ball of cells (embryo) while moving to the uterus","The embryo implants in the uterus lining"],
 ex:"Egg released → sperm swims → one sperm enters → nuclei fuse (zygote) → divides → implantation. Fertilisation is in the oviduct; implantation is in the uterus about a week later."},
{id:"cy3",t:"cycle",s:"ii",type:"input",q:"A woman’s period starts on <b>1 March</b>. Her cycle is <b>28 days</b>. On about which date will she ovulate?",ph:"e.g. 5 March",
 accept:["^14(th)? ?(of )?mar(ch)?$","^mar(ch)? ?14(th)?$","^14 ?[/.-] ?0?3$","^0?3 ?[/.-] ?14$","^14$"],ans:"14 March",
 ex:"Day 1 = the first day of the period = 1 March. In a 28-day cycle, ovulation is on <b>day 14</b> = 14 March. Careful: day 14 is 13 days <i>after</i> day 1, so it’s 14 March, not 15 March."},
{id:"cy4",t:"cycle",s:"ii",type:"input",q:"<b>Harder (unfamiliar):</b> The part of the cycle after ovulation (the luteal phase) is about 14 days long in most women, whatever the cycle length. A woman has a <b>32-day</b> cycle and her period starts on <b>1 March</b>. On about which date will she ovulate?",ph:"e.g. 5 March",
 accept:["^18(th)? ?(of )?mar(ch)?$","^mar(ch)? ?18(th)?$","^18 ?[/.-] ?0?3$","^0?3 ?[/.-] ?18$","^18$"],ans:"18 March",
 ex:"Ovulation ≈ cycle length − 14 = 32 − 14 = <b>day 18</b> → 18 March. The ‘day 14’ rule only works for a 28-day cycle! A 24-day cycle would give day 10."},
{id:"cy5",t:"cycle",s:"ii",type:"input",q:"A period starts on <b>20 March</b>. The cycle is <b>28 days</b>. On what date should the <b>next</b> period start?",ph:"e.g. 1 May",
 accept:["^17(th)? ?(of )?apr(il)?$","^apr(il)? ?17(th)?$","^17 ?[/.-] ?0?4$","^0?4 ?[/.-] ?17$"],ans:"17 April",
 ex:"20 March + 28 days. March has 31 days, so 11 days takes you to 31 March, and 17 more days gives <b>17 April</b>."},
{id:"cy6",t:"cycle",s:"ii",type:"mcq",q:"An egg survives about 1 day after ovulation. Sperm can survive up to about 5 days. In a regular 28-day cycle, on which days is fertilisation most likely?",
 o:["About days 9–15","Days 1–5","Days 20–28","Any day; the chance is the same"],a:0,
 ex:"Ovulation is day 14. Sperm from sex up to 5 days before (day 9) can still be alive. The egg lives about a day after release (day 15). So the ‘fertile window’ is about days 9–15."},
{id:"cy7",t:"cycle",s:"ii",type:"written",q:"<b>Explain</b> why fertilisation can only happen during a short window each month. <span class='mk'>[4 marks]</span>",
 marks:[{p:"Only one egg is released per cycle, at ovulation (about day 14)",k:["ovulat|released|one egg|an egg"]},
  {p:"The egg only survives about 12–24 hours (one day)",k:["24|12|one day|1 day|a day|hours"]},
  {p:"Sperm can survive up to about 5 days, so sex a few days before ovulation can still lead to fertilisation",k:["5 days|five days|sperm (can )?(survive|live)|days before"]},
  {p:"At other times there is no egg in the oviduct, so the sperm have nothing to fertilise",k:["no (living |mature )?egg|not an egg|without an egg|isn.t an egg|nothing to fertili"]}],
 model:"In each cycle only <b>one egg</b> is released, at <b>ovulation</b> (around day 14 of a 28-day cycle). The egg only survives for about <b>12–24 hours</b> in the oviduct. Sperm can survive for up to about <b>5 days</b>, so fertilisation is only possible if sperm are present from about 5 days before ovulation until a day after. At other times of the month there is <b>no living egg</b> in the oviduct, so fertilisation cannot happen."},
{id:"cy8",t:"cycle",s:"i",type:"mcq",q:"Why does the uterus lining thicken during the cycle?",
 o:["To prepare for implantation: a thick lining with a rich blood supply can nourish an embryo","To protect the ovaries","To push the egg along the oviduct","To produce eggs"],a:0},
{id:"cy9",t:"cycle",s:"ii",type:"mcq",q:"If an egg is fertilised and the embryo implants, what happens to the uterus lining and to periods?",
 o:["The lining is kept thick and periods stop during pregnancy","The lining is lost as normal and periods continue","The lining becomes thinner so the baby has more room","Periods continue but are lighter"],a:0,
 ex:"The lining is needed to support the embryo and form part of the placenta, so it is not shed. A missed period is often the first sign of pregnancy."},
{id:"cy10",t:"cycle",s:"i",type:"match",q:"Match each phase of a 28-day cycle to what happens.",
 pairs:[["Menstruation (days 1–5)","The uterus lining breaks down and leaves through the vagina"],["Follicular phase (days 1–13)","An egg matures in the ovary and the lining starts to rebuild"],["Ovulation (day 14)","A mature egg is released from the ovary"],["Luteal phase (days 15–28)","The lining is kept thick, ready for a possible implantation"]],
 ex:"Note that the follicular phase (1–13) overlaps with menstruation (1–5): while the old lining is being lost, a new egg is already maturing."},
{id:"cy11",t:"cycle",s:"iii",type:"mcq",chart:"lining",q:"Look at the graph. During which days is the uterus lining being <b>lost</b>?",
 o:["Days 1–5","Days 5–14","Days 14–21","Days 21–28"],a:0,
 ex:"The thickness falls from 5 mm to 1 mm between days 1 and 5: that is <b>menstruation</b>. From day 5 it rises again (rebuilding)."},
{id:"cy12",t:"cycle",s:"iii",type:"mcq",chart:"lining",q:"Using the graph: if the egg released on day 14 were fertilised and implanted, <b>predict</b> what the line would do after day 28.",
 o:["Stay at about 6 mm (or higher) instead of falling, because the lining is kept for the embryo","Fall to 1 mm by day 33, as in a normal cycle","Fall to 0 mm because the embryo uses up the lining","Rise and fall every 7 days"],a:0,
 ex:"Without pregnancy the lining breaks down at the start of the next cycle. With implantation it is maintained, so the line would <b>plateau</b> (or rise) rather than fall."},
{id:"cy13",t:"cycle",s:"i",type:"mcq",q:"What is a <b>zygote</b>?",
 o:["The single cell formed when the nuclei of a sperm and egg fuse","A ball of cells implanted in the uterus","The developing baby from week 9","A mature egg ready for ovulation"],a:0,
 ex:"Zygote = ONE cell (fertilised egg). It then divides into a ball of cells → embryo → fetus (from week 9)."},
{id:"cy14",t:"cycle",s:"ii",type:"mcq",q:"In one cycle a woman’s ovaries release <b>two</b> eggs and each is fertilised by a different sperm. What will be the result if both implant?",
 o:["Non-identical twins, who are no more alike genetically than ordinary siblings","Identical twins, because they share the same mother","One baby with 92 chromosomes","Identical twins, because they were fertilised on the same day"],a:0,
 ex:"Two eggs + two different sperm = two different zygotes = <b>non-identical</b> twins. Identical twins come from <b>one</b> zygote that splits in two, so they have the same genes."},
{id:"cy15",t:"cycle",s:"ii",type:"mcq",q:"A couple has sex on <b>day 11</b> of a regular 28-day cycle, but not again. Could fertilisation happen?",
 o:["Yes: sperm can survive up to about 5 days, so some could still be alive when the egg is released on day 14","No: fertilisation can only happen on exactly day 14","No: the egg has already died by day 11","Yes: but only if the egg was released on day 11"],a:0},
{id:"cy16",t:"cycle",s:"i",type:"mcq",q:"In the menstrual cycle, <b>day 1</b> is…",
 o:["the first day of bleeding (the start of the period)","the day the egg is released","the last day of the period","the day the lining is thickest"],a:0,
 ex:"Always count from the first day of the period. This matters for every date calculation."},
// ---------------- PREGNANCY ----------------
{id:"pr1",t:"preg",s:"i",type:"mcq",q:"A developing baby is <b>6 weeks</b> old. What is it called, and what will it be called at <b>20 weeks</b>?",
 o:["An embryo at 6 weeks; a fetus at 20 weeks","A fetus at 6 weeks; an embryo at 20 weeks","A zygote at 6 weeks; an embryo at 20 weeks","An embryo at both ages"],a:0,
 ex:"Embryo = first <b>8 weeks</b>. Fetus = from <b>week 9</b> until birth. Zygote = only the single fertilised cell."},
{id:"pr2",t:"preg",s:"i",type:"multi",q:"Select <b>ALL</b> the things that pass <b>from the mother to the fetus</b> across the placenta.",
 o:["Oxygen","Glucose","Amino acids","Antibodies","Carbon dioxide","Urea","Red blood cells"],a:[0,1,2,3],
 ex:"Useful substances go mother → fetus: oxygen, glucose, amino acids, water, antibodies. Carbon dioxide and urea are <b>wastes</b> that go fetus → mother. Red blood cells don’t cross: the two bloods <b>do not mix</b>."},
{id:"pr3",t:"preg",s:"i",type:"mcq",q:"Which substances pass <b>from the fetus to the mother</b> across the placenta?",
 o:["Carbon dioxide and urea","Oxygen and glucose","Antibodies and amino acids","Blood and oxygen"],a:0,
 ex:"The mother’s lungs get rid of the CO₂ and her kidneys get rid of the urea."},
{id:"pr4",t:"preg",s:"ii",type:"mcq",q:"The mother’s blood and the fetus’s blood come very close in the placenta but <b>do not mix</b>. Suggest why this is important.",
 o:["The mother’s higher blood pressure could damage the fetus’s vessels, their blood groups may not match, and the barrier keeps out many harmful substances and pathogens","So the fetus does not get any oxygen from the mother","So the fetus can make its own glucose","Because blood can’t move through the umbilical cord"],a:0,
 ex:"Substances cross by <b>diffusion</b> through a thin barrier, not by blood mixing. But the barrier is not perfect: alcohol, nicotine, carbon monoxide, some drugs and some viruses (e.g. rubella) can still cross."},
{id:"pr5",t:"preg",s:"ii",type:"multi",q:"Select <b>ALL</b> the features that make the placenta good at exchanging substances.",
 o:["Finger-like villi that give a large surface area","A very thin barrier between the two bloods (short distance to diffuse)","A rich blood supply on both sides","A thick muscular wall to push substances across","It is filled with amniotic fluid"],a:[0,1,2],
 ex:"Large surface area + thin barrier + good blood supply = fast diffusion. Diffusion doesn’t need muscle. Amniotic fluid surrounds the fetus, not the inside of the placenta."},
{id:"pr6",t:"preg",s:"i",type:"match",q:"Match each stage of pregnancy to what happens.",
 pairs:[["Trimester 1 (weeks 1–12)","Implantation; placenta forms; heart starts beating; all major organs form"],["Trimester 2 (weeks 13–26)","Fetus grows quickly; mother feels it move; it can hear sounds"],["Trimester 3 (weeks 27–40)","Rapid weight gain and fat stored; lungs mature; turns head-down"],["Birth (about week 40)","Cervix widens; uterus muscles contract; placenta comes out afterwards"]],
 ex:"Trimester 1 is when the embryo is <b>most vulnerable</b> to alcohol, drugs and infections, because the organs are forming."},
{id:"pr7",t:"preg",s:"i",type:"mcq",q:"What is the main job of the <b>amniotic fluid</b>?",
 o:["Cushions and protects the fetus from bumps and lets it move","Carries oxygen to the fetus","Removes urea from the fetus","Digests food for the fetus"],a:0},
{id:"pr8",t:"preg",s:"ii",type:"mcq",q:"Doctors say drinking alcohol is especially dangerous in the <b>first trimester</b>. Which is the best explanation?",
 o:["Alcohol can cross the placenta, and in the first trimester the organs are forming, so damage can be permanent","Alcohol cannot cross the placenta until the second trimester","The placenta makes alcohol in the first trimester","The fetus drinks the amniotic fluid only in the first trimester"],a:0},
{id:"pr9",t:"preg",s:"i",type:"mcq",q:"What is the function of the <b>umbilical cord</b>?",
 o:["It contains blood vessels that carry blood between the fetus and the placenta","It connects the placenta to the mother’s stomach","It carries air into the fetus’s lungs","It holds the baby in the uterus until birth"],a:0,
 ex:"The cord connects fetus ↔ placenta, not fetus ↔ mother directly. Blood vessels in the cord bring oxygen and nutrients from the placenta and take CO₂ and urea back to it."},
{id:"pr10",t:"preg",s:"ii",type:"written",q:"A baby is born very early, at <b>26 weeks</b>. It often needs a machine to help it breathe and is kept in a warm incubator. <b>Explain</b> why, using your knowledge of the trimesters. <span class='mk'>[4 marks]</span>",
 marks:[{p:"The lungs mature during the third trimester (weeks 27–40)",k:["lung","third|3rd|27|matur"]},
  {p:"At 26 weeks the lungs are not fully developed, so the baby cannot breathe well alone",k:["not (fully )?(developed|mature|ready)|immature|undeveloped|can.?t breathe|cannot breathe"]},
  {p:"Before birth, oxygen came from the mother through the placenta / umbilical cord, so the lungs had not been used",k:["placenta|umbilical|cord|mother"]},
  {p:"Fat is mostly stored in the third trimester, so the baby has little fat to keep warm, so it needs an incubator",k:["fat|warm|heat|temperature"]}],
 model:"At 26 weeks the baby has missed the <b>third trimester</b>, which is when the <b>lungs mature</b>. Its lungs are not fully developed, so it cannot breathe well on its own and needs a ventilator. Before birth it never needed its lungs, because it got oxygen from the mother’s blood by diffusion across the <b>placenta</b>, through the <b>umbilical cord</b>. It has also missed the rapid weight gain of the third trimester, so it has very little <b>fat</b> to keep it warm and is kept in an incubator."},
{id:"pr11",t:"preg",s:"i",type:"order",q:"Put the stages of development in order.",
 items:["Fertilisation forms a zygote","Zygote divides into a ball of cells","Embryo implants in the uterus lining","Placenta forms and the heart starts beating","Called a fetus from week 9","Lungs mature and rapid weight gain","Birth at about 40 weeks"]},
{id:"pr12",t:"preg",s:"i",type:"mcq",q:"Why is the placenta described as a <b>temporary</b> organ?",
 o:["It only forms during pregnancy and is pushed out after the baby (the ‘afterbirth’)","It only works for the first trimester","It is replaced by the umbilical cord","It dissolves when the baby starts breathing"],a:0},
{id:"pr13",t:"preg",s:"iii",type:"mcq",chart:"smoke",q:"Which conclusion is <b>best supported</b> by the data?",
 o:["As cigarettes smoked per day increase from 0 to 30, mean birth mass falls from 3.4 kg to 2.7 kg, so smoking is linked to lower birth mass","Smoking 30 cigarettes a day makes all babies weigh 2.7 kg","Smoking has no effect on birth mass because all the babies are over 2.5 kg","Birth mass falls by the same amount for every extra cigarette smoked"],a:0,
 ex:"The best answer gives the <b>trend with numbers and units</b>. Option 2 ignores that these are <b>means</b>; individual babies vary. Option 4 is wrong: 0→10 drops 0.4 kg but 20→30 only drops 0.1 kg, so the fall <b>slows down</b>."},
{id:"pr14",t:"preg",s:"iii",type:"written",chart:"smoke",q:"<b>Analyse</b> the data in the graph. Describe the trend using numbers, explain it using your knowledge of the placenta, and comment on how far the data proves that smoking causes low birth mass. <span class='mk'>[5 marks]</span>",
 marks:[{p:"Trend with numbers: mean birth mass falls from 3.4 kg (0 a day) to 2.7 kg (30 a day)",k:["3\\.4","2\\.7"]},
  {p:"Identifies the pattern: more cigarettes, lower mass; the decrease slows / levels off at higher numbers",k:["decreas|lower|less|negative|fall|drop|reduc"]},
  {p:"Harmful substances (carbon monoxide / nicotine) cross the placenta",k:["placenta","carbon monoxide|nicotine|chemical|toxin|substance|smoke"]},
  {p:"So less oxygen (and nutrients) reach the fetus, so it grows less",k:["oxygen|nutrient"]},
  {p:"Limitation: shows a correlation; other factors (diet, age, alcohol) or sample size not given, so it doesn’t prove cause",k:["correlat|other factor|prove|caus|diet|sample|how many|control"]}],
 model:"As the number of cigarettes smoked per day increases, the mean birth mass <b>decreases</b>: from <b>3.4 kg</b> at 0 cigarettes to <b>2.7 kg</b> at 30. The fall is biggest at first (0.4 kg between 0 and 10) and smaller later (0.1 kg between 20 and 30). This can be explained because <b>carbon monoxide and nicotine cross the placenta</b>; carbon monoxide reduces the <b>oxygen</b> carried in the blood and nicotine narrows blood vessels, so the fetus gets less oxygen and nutrients and grows less. However, the data only shows a <b>correlation</b>. We don’t know how many mothers were studied or whether other factors like diet, age or alcohol were controlled, so it does not prove on its own that smoking is the cause."},
{id:"pr15",t:"preg",s:"ii",type:"mcq",q:"If a woman catches rubella (German measles) early in pregnancy, her baby may be born deaf. What does this tell you about the placenta?",
 o:["Some pathogens (like viruses) can cross the placenta, so it is not a perfect barrier","The placenta makes viruses","The blood of the mother and fetus mixes completely","The fetus catches rubella through the vagina"],a:0},
{id:"pr16",t:"preg",s:"ii",type:"mcq",q:"Why does the placenta’s surface have thousands of tiny finger-like <b>villi</b>?",
 o:["To increase the surface area, so substances diffuse faster","To grip the uterus so the baby doesn’t fall out","To filter out all harmful substances","To pump blood to the fetus"],a:0},
// ---------------- FLOWERS ----------------
{id:"fl1",t:"flower",s:"i",type:"match",fig:"flower",q:"Label the half-flower: match each letter to the correct part.",
 pairs:[["A","Stigma"],["B","Style"],["C","Ovary"],["D","Ovule"],["E","Anther"],["F","Filament"],["G","Petal"],["H","Sepal"],["I","Nectary"]],
 ex:"Female (carpel) = stigma + style + ovary (with ovules inside). Male (stamen) = anther + filament. Petals attract insects, sepals protect the bud, nectaries make nectar."},
{id:"fl2",t:"flower",s:"i",type:"multi",q:"Select <b>ALL</b> the parts that make up the <b>carpel</b>.",
 o:["Stigma","Style","Ovary","Anther","Filament","Petal"],a:[0,1,2],
 ex:"Carpel = <b>S</b>tigma, <b>S</b>tyle, <b>O</b>vary (the ovules are inside the ovary). Stamen = anther + filament."},
{id:"fl3",t:"flower",s:"i",type:"mcq",q:"What is the function of the <b>sepals</b>?",
 o:["Protect the flower while it is still a bud","Attract insects with bright colours","Catch pollen","Make nectar"],a:0},
{id:"fl4",t:"flower",s:"i",type:"mcq",q:"What is the function of the <b>nectary</b>?",
 o:["Makes sugary nectar to attract insects","Makes pollen","Contains the ovules","Protects the flower bud"],a:0,
 ex:"While the insect drinks nectar, pollen brushes onto its body. Wind-pollinated flowers usually have no nectaries: they don’t need to attract insects."},
{id:"fl5",t:"flower",s:"i",type:"order",q:"Put the flower parts in order from the <b>outside</b> to the <b>centre</b> of the flower.",
 items:["Sepals","Petals","Stamens","Carpel"],
 ex:"Outside → in: sepals → petals → stamens → carpel. This is the order you remove them in a dissection."},
{id:"fl6",t:"flower",s:"ii",type:"mcq",q:"Why do we dissect a flower from the <b>outside in</b>?",
 o:["The outer parts cover the inner parts, so removing them first lets us reach the inner parts without damaging them","Because the outer parts are the most important","Because the scalpel only cuts outer parts","So we can count the carpels first"],a:0},
{id:"fl7",t:"flower",s:"i",type:"match",q:"Match each part of the flower to its function.",
 pairs:[["Anther","Makes pollen"],["Filament","Holds the anther up"],["Stigma","Sticky surface that catches pollen"],["Style","Connects stigma to ovary; the pollen tube grows down it"],["Ovary","Contains the ovules; becomes the fruit"],["Petal","Brightly coloured to attract insects"]]},
{id:"fl8",t:"flower",s:"i",type:"mcq",q:"After fertilisation, which part of the flower becomes the <b>fruit</b> and which becomes the <b>seed</b>?",
 o:["Ovary → fruit; ovule → seed","Ovule → fruit; ovary → seed","Petal → fruit; stigma → seed","Anther → fruit; pollen → seed"],a:0,
 ex:"<b>Big trap!</b> The OVARY (the bigger outer part) becomes the FRUIT. The OVULES inside it become the SEEDS. Think of a pea pod: the pod is the ovary, the peas are the ovules."},
{id:"fl9",t:"flower",s:"ii",type:"mcq",q:"Explorers find a new plant on a windy mountain. Its flowers are small and green, with feathery stigmas hanging outside the flower, and no scent. What can you conclude about its pollen?",
 o:["It is wind-pollinated, so it probably makes huge amounts of small, light, smooth pollen from anthers that hang outside the flower","It is insect-pollinated, so it makes sticky, spiky pollen","It is wind-pollinated, so it makes a small amount of heavy, sticky pollen","It doesn’t make pollen because it has no petals"],a:0,
 ex:"Feathery stigmas outside + small green petals + no scent = <b>wind</b>. Wind is random, so most pollen is wasted. That’s why it makes lots of it, and why the pollen is light enough to blow far."},
{id:"fl10",t:"flower",s:"ii",type:"written",q:"<b>Explain</b> how a wind-pollinated flower, such as grass, is adapted for pollination. <span class='mk'>[5 marks]</span>",
 marks:[{p:"Anthers hang outside the flower on long filaments so the wind can blow pollen away",k:["anther","outside|hang|long|expos"]},
  {p:"Makes huge amounts of pollen because most is lost / wasted",k:["lot|large amount|huge|million|many|more pollen|amount"]},
  {p:"Pollen is small, light and smooth, so it is carried far by the wind",k:["light|small|smooth"]},
  {p:"Feathery stigmas outside the flower give a large surface area to catch pollen from the air",k:["feather|net","stigma"]},
  {p:"Small, dull/green petals (or none), no scent or nectar: no need to attract insects, which saves energy",k:["petal|dull|green|scent|nectar|energy"]}],
 model:"Wind-pollinated flowers have <b>anthers that hang outside the flower on long filaments</b>, so the wind easily blows the pollen away. They make <b>huge amounts of pollen</b>, because wind is random and most of it never reaches a stigma. The pollen is <b>small, light and smooth</b> so it can be carried a long way. The <b>stigmas are feathery and hang outside</b> the flower, acting like a net with a large surface area to catch pollen from the air. The petals are <b>small and green</b> (or missing) with <b>no scent or nectar</b>, because there is no need to attract insects, so the plant saves energy."},
{id:"fl11",t:"flower",s:"ii",type:"multi",q:"A foxglove has tall, purple, tube-shaped flowers, spots leading inside to nectar, and sticky pollen. Select <b>ALL</b> the pieces of evidence that it is <b>insect-pollinated</b>.",
 o:["Brightly coloured (purple) petals","Spots leading inside (guides to the nectar)","Nectar","Sticky pollen","Tube shape: the bee must squeeze past the anthers and stigma","Feathery stigmas hanging outside","Huge amounts of light, smooth pollen"],a:[0,1,2,3,4],
 ex:"The last two are wind-pollination features. In an exam, use the evidence: “The petals are purple, <b>which attracts</b> bees; the pollen is sticky <b>so it sticks to</b> the bee’s body…”"},
{id:"fl12",t:"flower",s:"ii",type:"mcq",q:"A plant breeder carefully removes all the anthers from a flower before it opens, then covers it with a bag. Suggest why.",
 o:["To stop self-pollination, so the breeder can choose which pollen (from another plant) fertilises it","To make the flower produce more nectar","To let the wind pollinate it","To make the ovary grow faster"],a:0,
 ex:"No anthers = no pollen of its own. The bag stops insects bringing random pollen. The breeder then brushes on pollen from a chosen plant: controlled <b>cross-pollination</b>."},
{id:"fl13",t:"flower",s:"i",type:"mcq",q:"Which of these is <b>NOT</b> a rule for a scientific observational drawing?",
 o:["Use shading to show which parts are darker","Use a sharp pencil","Draw label lines with a ruler, with no arrowheads, and don’t let them cross","Draw exactly what you see, not what you expect to see"],a:0,
 ex:"Observational drawings use clear single lines and <b>no shading</b>. Also: add a title, and keep labels outside the drawing."},
{id:"fl14",t:"flower",s:"i",type:"mcq",q:"Which of these is <b>unsafe</b> during a flower dissection?",
 o:["Holding the flower in your hand and cutting towards your fingers to keep it steady","Cutting on a white tile","Cutting away from your body","Reporting any cut to the teacher straight away"],a:0,
 ex:"Always cut on the tile, away from your body and fingers. Keep blades pointing down when carrying, report cuts, and wash your hands at the end."},
{id:"fl15",t:"flower",s:"i",type:"mcq",q:"True or false? “A pollen grain <b>is</b> the male gamete.”",
 o:["False: the pollen grain contains (carries) the male gamete","True: pollen is the plant’s sperm","False: pollen contains the female gamete","True: pollen and ovules are both gametes"],a:0,
 ex:"Precise wording earns marks at level 7–8: pollen grains <b>contain</b> the male gamete; ovules <b>contain</b> the female gamete."},
{id:"fl16",t:"flower",s:"ii",type:"mcq",q:"A flower has 5 sepals, 5 petals, 10 stamens and 1 carpel. How many <b>anthers</b> and how many <b>stigmas</b> does it have?",
 o:["10 anthers, 1 stigma","5 anthers, 5 stigmas","10 anthers, 10 stigmas","1 anther, 10 stigmas"],a:0,
 ex:"Each stamen has one anther (10). Each carpel has one stigma (1)."},
{id:"fl17",t:"flower",s:"ii",type:"mcq",q:"Why do insect-pollinated flowers make much <b>less</b> pollen than wind-pollinated flowers?",
 o:["Insects carry pollen fairly directly to another flower of the same species, so much less is wasted","Insects eat most of the pollen","Their anthers are smaller because their petals are bigger","Insect-pollinated flowers don’t need fertilisation"],a:0},
// ---------------- POLLINATION, DISPERSAL, LIFE CYCLES ----------------
{id:"po1",t:"poll",s:"i",type:"mcq",q:"What is <b>pollination</b>?",
 o:["The transfer of pollen from an anther to a stigma","The fusing of the male and female gamete nuclei","The spreading of seeds away from the parent","When a seed starts to grow"],a:0,
 ex:"The others are fertilisation, seed dispersal and germination."},
{id:"po2",t:"poll",s:"i",type:"mcq",q:"What is the difference between pollination and fertilisation in a plant?",
 o:["Pollination moves pollen to the stigma; fertilisation is when the male gamete nucleus fuses with the female gamete nucleus in the ovule","They are two words for the same thing","Fertilisation happens first, then pollination","Pollination happens in the ovule; fertilisation happens on the stigma"],a:0,
 ex:"Pollination comes first and is just <i>moving</i> pollen. Fertilisation is the <i>fusing</i> of nuclei, inside the ovule."},
{id:"po3",t:"poll",s:"i",type:"order",q:"Put these steps in order, from pollination to a new seed.",
 items:["Pollen lands on the stigma","A pollen tube grows down through the style","The tube enters the ovary and reaches an ovule","The male gamete nucleus fuses with the female gamete nucleus","The ovule becomes a seed and the ovary becomes a fruit"]},
{id:"po4",t:"poll",s:"ii",type:"mcq",q:"In some plants, the anthers release pollen several days <b>before</b> the stigma on the same flower is ready. Suggest why this is useful.",
 o:["It prevents self-pollination and encourages cross-pollination, which creates more variation","It means the plant makes more pollen","It protects the stigma from insects","It means the flower doesn’t need petals"],a:0},
{id:"po5",t:"poll",s:"i",type:"match",q:"Match each fruit or seed to how it is dispersed.",
 pairs:[["Sycamore (winged seed)","Wind: wings make it spin and fall slowly"],["Dandelion (hairy parachute)","Wind: floats on air currents"],["Burdock (hooked fruit)","Animal: hooks catch on fur"],["Cherry (sweet, fleshy fruit)","Animal: eaten, seed passes out in droppings"],["Pea pod","Explosive: pod dries and bursts open"],["Coconut","Water: floats to new shores"]]},
{id:"po6",t:"poll",s:"ii",type:"written",q:"<b>Explain</b> why seed dispersal helps a plant species to survive. <span class='mk'>[4 marks]</span>",
 marks:[{p:"Reduces competition with the parent plant (and between seedlings)",k:["compet"]},
  {p:"…for light, water, minerals (nutrients) or space",k:["light|water|mineral|nutrient|space"]},
  {p:"Allows the species to colonise / spread to new areas",k:["new area|new place|new habitat|colon|spread|far"]},
  {p:"If one area is hit by disease, fire, drought or change, plants elsewhere can survive",k:["disease|fire|flood|drought|surviv|change"]}],
 model:"If seeds fell right under the parent they would <b>compete</b> with it (and with each other) for <b>light, water, minerals and space</b>, and many would die. Dispersal spreads the seeds away from the parent, so the seedlings have a better chance of getting what they need. It also lets the species <b>colonise new areas</b>, so if one area is hit by disease, fire or drought, plants in other places can still survive."},
{id:"po7",t:"poll",s:"ii",type:"mcq",q:"A newly discovered fruit is bright red, sweet and fleshy, and its seeds have a very hard coat that cannot be digested. How are its seeds most likely dispersed?",
 o:["Animals eat the fruit and the seeds pass out unharmed in their droppings, far from the parent","Wind blows the fruit away","The fruit explodes and flings out its seeds","The seeds float on water"],a:0,
 ex:"Bright + sweet + fleshy = attract animals. A hard coat = survive the gut. Droppings even act as fertiliser."},
{id:"po8",t:"poll",s:"ii",type:"mcq",q:"How do the ‘wings’ of a sycamore seed help the plant?",
 o:["They make the seed spin and fall slowly, so the wind can carry it further from the parent","They let the seed fly back to the parent tree","They protect the seed from being eaten","They help the seed photosynthesise"],a:0},
{id:"po9",t:"poll",s:"i",type:"multi",q:"Select <b>ALL</b> the conditions most seeds need to <b>germinate</b>.",
 o:["Water","Oxygen","Warmth (a suitable temperature)","Light","Soil"],a:[0,1,2],
 ex:"Water makes the seed swell and activates it, oxygen is needed for respiration (energy), warmth lets its enzymes work. Most seeds do <b>not</b> need light: they germinate underground using their food store. Soil isn’t needed either; cress grows on wet cotton wool!"},
{id:"po10",t:"poll",s:"i",type:"order",q:"Put the flowering plant life cycle in order, starting from a seed.",
 items:["Seed germinates","Seedling grows into an adult plant","Plant produces flowers","Pollination","Fertilisation","Seeds form inside a fruit","Seeds are dispersed"]},
{id:"po11",t:"poll",s:"i",type:"order",q:"A ladybird goes through complete metamorphosis. Put its life cycle in order.",
 items:["Egg","Larva","Pupa","Adult"],
 ex:"Butterflies do the same (caterpillar = larva, chrysalis = pupa). Frogs: egg → tadpole → froglet → adult."},
{id:"po12",t:"poll",s:"ii",type:"mcq",q:"Which statement correctly compares plant and animal life cycles?",
 o:["Both involve gametes fusing at fertilisation, but most plants can’t move to find a mate, so they rely on wind or animals to carry pollen","Animals have a life cycle but plants do not","Plants reproduce only asexually and animals only sexually","In both, fertilisation happens in an oviduct"],a:0},
{id:"po13",t:"poll",s:"ii",type:"mcq",q:"A cod fish releases millions of eggs into the sea, while a human usually has one baby at a time. Which is the best explanation?",
 o:["Cod use external fertilisation and give no parental care, so most eggs and young are eaten or die; mammals use internal fertilisation and care for few young, so most survive","Cod eggs are larger than human eggs","Humans can only make one egg in their lifetime","Fish don’t need fertilisation"],a:0},
{id:"po14",t:"poll",s:"ii",type:"mcq",q:"Pollen from one flower on an apple tree is carried by a bee to a <b>different flower on the same tree</b>. What type of pollination is this?",
 o:["Self-pollination: it is the same plant","Cross-pollination: it is a different flower","Cross-pollination: a bee carried it","Not pollination, because it didn’t reach the anther"],a:0,
 ex:"<b>Trap!</b> Self-pollination = same flower <b>or same plant</b>. Cross-pollination needs a <b>different plant</b> of the same species, because a different plant has different genes, which creates variation."},
{id:"po15",t:"poll",s:"ii",type:"mcq",q:"Cress seeds are placed in a sealed jar with all the air removed, with water at 20 °C. They don’t germinate. Why?",
 o:["There is no oxygen, which they need for respiration to release energy for growth","They need light","20 °C is too cold for all seeds","They need soil"],a:0},
{id:"po16",t:"poll",s:"ii",type:"written",q:"<b>Describe</b> what happens in a flowering plant from pollination to the formation of a seed and fruit. <span class='mk'>[5 marks]</span>",
 marks:[{p:"Pollen is transferred from an anther to a stigma (of the same species)",k:["anther","stigma"]},
  {p:"A pollen tube grows down through the style",k:["tube","style"]},
  {p:"…into the ovary to reach an ovule",k:["ovule|ovary"]},
  {p:"The male gamete nucleus fuses with the female gamete nucleus = fertilisation",k:["fus|join|fertili"]},
  {p:"The ovule becomes a seed and the ovary becomes a fruit",k:["seed","fruit"]}],
 model:"First, <b>pollination</b>: pollen is carried by insects or wind from an <b>anther</b> to the sticky <b>stigma</b> of a flower of the same species. The pollen grain grows a <b>pollen tube</b> down through the <b>style</b> into the <b>ovary</b> and into an <b>ovule</b>. The male gamete nucleus travels down the tube and <b>fuses</b> with the female gamete nucleus in the ovule: this is <b>fertilisation</b>, forming a zygote. The fertilised <b>ovule develops into a seed</b> (containing an embryo plant and a food store) and the <b>ovary develops into the fruit</b>, while the petals and stamens wither."},
{id:"po17",t:"poll",s:"ii",type:"written",q:"<b>Unfamiliar situation.</b> A plant lives on a remote island where there are <b>no insects</b>, but there are strong winds and lots of fruit-eating birds. Suggest and justify <b>two</b> adaptations of its flowers and <b>two</b> of its fruits/seeds. <span class='mk'>[5 marks]</span>",
 marks:[{p:"Flowers wind-pollinated: anthers hang outside the flower so the wind can blow pollen away",k:["anther","outside|hang|long|expos"]},
  {p:"Feathery stigmas outside / lots of small, light pollen, to catch or be carried by wind",k:["feather|light|small pollen|lots of pollen|large amount|huge"]},
  {p:"No need for bright petals / scent / nectar (no insects), so saves energy",k:["petal|nectar|scent|energy"]},
  {p:"Fruit bright / sweet / fleshy to attract birds, which eat it and drop seeds elsewhere",k:["fleshy|sweet|bright|colou?r|juicy|tasty","bird|eat|dropping"]},
  {p:"Seeds with a hard coat survive digestion; justified: spreads seeds away to reduce competition",k:["hard|coat|digest|compet|away from"]}],
 model:"With no insects, the flowers must be <b>wind-pollinated</b>: anthers should hang outside on long filaments so wind blows the pollen off, and the stigmas should be <b>feathery and outside</b> the flower to catch pollen. They should make lots of <b>small, light pollen</b>. Bright petals, scent and nectar would waste energy because there are no insects to attract. Since there are fruit-eating birds, the fruits should be <b>brightly coloured, sweet and fleshy</b> so birds eat them, and the seeds should have a <b>hard coat</b> so they survive digestion and are dropped far away, reducing <b>competition</b> with the parent."},
// ---------------- DNA ----------------
{id:"dn1",t:"dna",s:"ii",type:"input",norm:"dna",q:"Write the complementary (partner) strand for: <b style='font-family:monospace;font-size:20px;letter-spacing:3px'>A T G C C T A G G</b>",ph:"type the 9 letters",ans:"TACGGATCC",
 ex:"A↔T, C↔G. A→T, T→A, G→C, C→G, C→G, T→A, A→T, G→C, G→C = <b>TACGGATCC</b>. Memory trick: <i>Apple in the Tree, Car in the Garage</i>."},
{id:"dn2",t:"dna",s:"ii",type:"input",norm:"dna",q:"Write the partner strand for: <b style='font-family:monospace;font-size:20px;letter-spacing:3px'>G G C A T T A C</b>",ph:"type the 8 letters",ans:"CCGTAATG",
 ex:"G→C, G→C, C→G, A→T, T→A, T→A, A→T, C→G = <b>CCGTAATG</b>."},
{id:"dn3",t:"dna",s:"i",type:"order",q:"Put these in order from <b>LARGEST</b> to <b>smallest</b>.",
 items:["Cell","Nucleus","Chromosome","Gene","Base pair"],
 ex:"A cell contains a nucleus → which contains chromosomes → each chromosome is a long coiled DNA molecule containing many genes → each gene is a sequence of many base pairs."},
{id:"dn4",t:"dna",s:"i",type:"mcq",q:"What is a <b>nucleotide</b> made of?",
 o:["A phosphate, a sugar (deoxyribose) and a base","Two bases joined together","A gene and a chromosome","A protein and a sugar"],a:0,
 ex:"Two bases joined across the ladder is a <b>base pair</b>, not a nucleotide."},
{id:"dn5",t:"dna",s:"i",type:"mcq",q:"What shape is a DNA molecule?",
 o:["A double helix: two strands twisted around each other like a spiral ladder","A single straight strand","A circle of bases","A triple helix"],a:0},
{id:"dn6",t:"dna",s:"i",type:"mcq",q:"How many chromosomes are in a normal human <b>body</b> cell, and in a <b>gamete</b>?",
 o:["46 (23 pairs) in a body cell; 23 in a gamete","23 in a body cell; 46 in a gamete","46 in both","92 in a body cell; 46 in a gamete"],a:0},
{id:"dn7",t:"dna",s:"ii",type:"input",q:"<b>Challenge:</b> In a sample of DNA, <b>30%</b> of the bases are A (adenine). What percentage are <b>G</b> (guanine)?",ph:"a number",
 accept:["^20 ?%?$","^20 ?percent$"],ans:"20%",
 ex:"A pairs with T, so T = 30% too. A + T = 60%, leaving 40% for C + G. C = G, so G = <b>20%</b>."},
{id:"dn8",t:"dna",s:"ii",type:"input",q:"<b>Challenge:</b> A DNA molecule contains <b>1000</b> bases in total. <b>180</b> of them are C. How many are <b>A</b>?",ph:"a number",
 accept:["^320$"],ans:"320",
 ex:"C = G = 180, so C + G = 360. That leaves 1000 − 360 = 640 for A + T. A = T, so A = <b>320</b>."},
{id:"dn9",t:"dna",s:"i",type:"mcq",q:"What is a <b>gene</b>?",
 o:["A short section of DNA on a chromosome that codes for one protein or characteristic","A whole chromosome","The nucleus of a cell","One base, such as A or T"],a:0},
{id:"dn10",t:"dna",s:"i",type:"mcq",q:"What was <b>Photo 51</b>, and why was it important?",
 o:["An X-ray image of DNA taken by Rosalind Franklin; its X-shaped pattern showed DNA is a helix, helping Watson and Crick build their model","A microscope photo of a sperm entering an egg","The first photo of a chromosome, taken by Watson","A photo of a double helix taken with a normal camera"],a:0,
 ex:"Rosalind Franklin used <b>X-ray diffraction</b> (1952). The X shape is the pattern a helix makes. Watson and Crick used her data to build the double-helix model in 1953."},
{id:"dn11",t:"dna",s:"ii",type:"mcq",q:"Seeds from the same sunflower grow into plants that are all slightly different. Why?",
 o:["Each seed came from a separate fertilisation, with a different combination of genes from the pollen and ovule","All the seeds are clones, but some got more water","The seeds were made asexually","The sunflower changes its DNA every day"],a:0,
 ex:"Each seed = one ovule fertilised by one pollen grain (possibly from different plants). Each combination of genes is different, so we get variation. The environment (water, light) can add more differences, but it isn’t the main reason here."},
{id:"dn12",t:"dna",s:"i",type:"mcq",q:"Where is the genetic information kept in a human cell?",
 o:["In the nucleus, as DNA in chromosomes","In the cell membrane","In the cytoplasm, as proteins","In the mitochondria only"],a:0},
{id:"dn13",t:"dna",s:"i",type:"mcq",q:"In the ‘spiral ladder’ model of DNA, what are the <b>sides</b> and what are the <b>rungs</b>?",
 o:["Sides: sugar and phosphate; rungs: pairs of bases","Sides: bases; rungs: sugar and phosphate","Sides: genes; rungs: chromosomes","Sides: proteins; rungs: genes"],a:0},
{id:"dn14",t:"dna",s:"ii",type:"mcq",q:"A man’s sperm cell has 23 chromosomes. How many chromosomes does a <b>skin cell</b> from the same man have?",
 o:["46","23","92","69"],a:0},
{id:"dn15",t:"dna",s:"ii",type:"mcq",q:"A piece of double-stranded DNA has <b>12 base pairs</b>. How many <b>nucleotides</b> does it contain?",
 o:["24","12","6","36"],a:0,
 ex:"Each base pair = 2 bases, and each base belongs to one nucleotide. 12 × 2 = <b>24</b> nucleotides."},
{id:"dn16",t:"dna",s:"ii",type:"mcq",q:"A zygote has 46 chromosomes. Where did they come from?",
 o:["23 from the sperm (father) and 23 from the egg (mother)","All 46 from the egg","All 46 from the sperm","It makes all 46 new ones itself"],a:0},
{id:"dn17",t:"dna",s:"i",type:"written",q:"<b>Describe</b> the structure of DNA, using the words <i>nucleotide</i>, <i>base pair</i> and <i>double helix</i>. <span class='mk'>[5 marks]</span>",
 marks:[{p:"Two strands twisted together into a double helix (spiral ladder)",k:["double helix|two strands|twist|spiral"]},
  {p:"Each strand is made of many nucleotides joined together",k:["nucleotide"]},
  {p:"Each nucleotide = a phosphate + a sugar (deoxyribose) + a base",k:["phosphate","sugar|deoxyribose","base"]},
  {p:"Sugar and phosphate form the sides (backbone); base pairs form the rungs",k:["rung|side|backbone|ladder|step"]},
  {p:"Bases pair in a fixed way: A with T, and C with G",k:["\\bA\\b.{0,25}\\bT\\b|adenine.{0,30}thymine","\\bC\\b.{0,25}\\bG\\b|cytosine.{0,30}guanine"]}],
 model:"DNA is made of <b>two strands</b> twisted around each other into a <b>double helix</b>, like a spiral ladder. Each strand is a long chain of <b>nucleotides</b>; each nucleotide is made of a <b>phosphate</b>, a <b>sugar called deoxyribose</b> and a <b>base</b>. The sugars and phosphates form the sides of the ladder, and the bases from the two strands join in the middle to form the rungs. Each rung is a <b>base pair</b>, and the pairing is always the same: <b>A pairs with T, and C pairs with G</b>. The order of the bases forms the genetic code."},
{id:"dn18",t:"dna",s:"i",type:"multi",q:"Select <b>ALL</b> the things that contain DNA.",
 o:["A human skin cell","A sperm cell","An egg cell","A bacterium","A pollen grain","A grain of salt"],a:[0,1,2,3,4],
 ex:"All living cells contain DNA. Bacteria have DNA but <b>no nucleus</b>: it floats loose in the cytoplasm. Salt isn’t alive."},
// ---------------- DATA ANALYSIS ----------------
{id:"da1",t:"data",s:"iii",type:"mcq",chart:"cuttings",q:"A class investigated whether the number of leaves on a cutting affects root growth. Which statement <b>best describes</b> the trend?",
 o:["As the number of leaves increases from 0 to 4, mean root length increases from 2 mm to 24 mm; from 4 to 6 leaves it levels off (plateaus) at about 25 mm","More leaves always give longer roots","Root length increases steadily by the same amount for every extra leaf","Root length decreases after 4 leaves"],a:0,
 ex:"A top-level description: (1) direction of trend, (2) <b>numbers with units</b> from the graph, (3) <b>key features</b> such as a <b>plateau</b>. Option 2 is too vague and ignores the plateau. Option 3 is wrong: the increases are +6, +7, +6, +3, +1, +0."},
{id:"da2",t:"data",s:"iii",type:"written",chart:"cuttings",q:"<b>Analyse</b> the cuttings data. Describe the trend with numbers, identify the key feature, explain the results with science, and comment on the conclusion. <span class='mk'>[5 marks]</span>",
 marks:[{p:"Root length increases as leaves increase from 0 to 4 (2 mm → 24 mm)",k:["increas","2 ?mm|24"]},
  {p:"Plateau: levels off at about 25 mm from 4 to 6 leaves",k:["plateau|level|constant|same|stop|flat"]},
  {p:"Leaves photosynthesise, making sugar (food/energy) that is used to grow roots",k:["photosynth|sugar|glucose|food|energy"]},
  {p:"After 4 leaves something else limits growth (e.g. water, light, space) or extra leaves lose more water",k:["limit|water|light|other factor|something else|space"]},
  {p:"Conclusion only valid from 0–6 leaves / need repeats or more cuttings to be confident",k:["repeat|more cutting|only|range|reliab|valid"]}],
 model:"As the number of leaves increases from <b>0 to 4</b>, the mean root length increases from <b>2 mm to 24 mm</b>. Between <b>4 and 6 leaves</b> the graph <b>plateaus</b> at about <b>25 mm</b>, so adding more leaves no longer helps. This is because leaves <b>photosynthesise</b>, making sugar that the cutting uses for energy to grow roots, so more leaves give more sugar. After about 4 leaves another factor, such as the amount of <b>water</b> or <b>light</b>, is limiting growth, and extra leaves also lose more water. The conclusion “more leaves = more root growth” is only true up to 4 leaves and we only tested up to 6; more repeats would make it more reliable."},
{id:"da3",t:"data",s:"iii",type:"input",table:"cut",q:"Look at the results table. Which value is the <b>anomaly</b> (anomalous result)?",ph:"a number",
 accept:["^9( ?mm)?$"],ans:"9",
 ex:"For 3 leaves, trials were 20, 22 and <b>9</b>. The 9 doesn’t fit the pattern (it is far from the other two and from the trend). It might have been a damaged cutting or a measuring mistake."},
{id:"da4",t:"data",s:"iii",type:"input",table:"cut",q:"Calculate the mean root length for <b>3 leaves</b>, <b>ignoring the anomaly</b>. Give your answer in mm.",ph:"a number",
 accept:["^21( ?mm)?$","^21\\.0( ?mm)?$"],ans:"21 mm",
 ex:"(20 + 22) ÷ 2 = <b>21 mm</b>. Including the anomaly would give (20 + 22 + 9) ÷ 3 = 17 mm, which is misleading."},
{id:"da5",t:"data",s:"iii",type:"multi",q:"Select <b>ALL</b> the changes that would improve the cuttings investigation (make it more valid and reliable).",
 o:["Use more cuttings for each number of leaves (more repeats)","Use cuttings from the same species with the same stem length","Keep light, temperature and volume of water the same for all","Measure all roots after the same number of days","Change the number of leaves and the temperature at the same time","Use only one cutting per group to save time"],a:[0,1,2,3],
 ex:"Only ONE variable should change (the independent variable: number of leaves). Good improvements are <b>specific</b>: say exactly what to control or repeat, not just “be more careful”."},
{id:"da6",t:"data",s:"iii",type:"mcq",chart:"cuttings",q:"A student concludes: “The more leaves a cutting has, the longer its roots grow.” Evaluate this conclusion.",
 o:["Only partly valid: it is true from 0 to 4 leaves, but from 4 to 6 the length plateaus, and we have no data beyond 6 leaves","Fully valid: the line goes up","Not valid at all: there is no pattern","Fully valid, because there were 7 different numbers of leaves"],a:0},
{id:"da7",t:"data",s:"iii",type:"mcq",chart:"heli",q:"In the paper helicopter investigation, what is the <b>independent</b> variable and the <b>dependent</b> variable?",
 o:["Independent: wing length; dependent: fall time","Independent: fall time; dependent: wing length","Independent: drop height; dependent: wing length","Independent: paper clip mass; dependent: fall time"],a:0,
 ex:"Independent = what YOU change (wing length). Dependent = what you measure (fall time). Drop height and paper clip mass are <b>control</b> variables."},
{id:"da8",t:"data",s:"iii",type:"multi",q:"Select <b>ALL</b> the variables that must be <b>controlled</b> (kept the same) when testing how wing length affects fall time.",
 o:["Drop height","Mass of the paper clip ‘seed’","Type of paper","No fans or draughts in the room","Wing length","Fall time"],a:[0,1,2,3],
 ex:"Wing length is the independent variable and fall time is the dependent variable, so they are not controlled."},
{id:"da9",t:"data",s:"iii",type:"mcq",q:"Why should each wing length be tested <b>three or more times</b> and a mean calculated?",
 o:["To reduce the effect of random errors (like reaction time) and to spot anomalies, so results are more reliable","To make the investigation take longer","So the helicopters fall faster","Because the first result is always wrong"],a:0},
{id:"da10",t:"data",s:"iii",type:"mcq",q:"The fall times are only about 1–2 seconds, so the stopwatch reaction time causes big errors. Which is the best <b>specific</b> improvement?",
 o:["Drop from a greater height (e.g. 4 m) or film the drop with a slow-motion video and time it from the video","Try harder to press the stopwatch at the right time","Use a heavier paper clip so it falls faster","Only do one drop for each wing length"],a:0,
 ex:"A longer fall time makes a ~0.2 s reaction error a smaller fraction of the total. Video removes reaction time completely. Vague answers like “be more careful” score low."},
{id:"da11",t:"data",s:"iii",type:"mcq",chart:"heli",q:"Which is the best analysis of the helicopter results?",
 o:["Fall time increases from 1.2 s to 2.4 s as wing length increases from 4 cm to 10 cm, then plateaus at 2.4 s between 10 and 12 cm","Fall time increases steadily with wing length across the whole range","Fall time doubles every time wing length increases by 2 cm","Wing length has no effect on fall time"],a:0,
 ex:"Look carefully at the end: 10 cm → 2.4 s and 12 cm → 2.4 s. That’s a <b>plateau</b>. Examiners love asking you to spot plateaus."},
{id:"da12",t:"data",s:"iii",type:"mcq",chart:"bags",q:"Scientists covered some flowers with fine mesh bags so insects couldn’t reach them. What is the best conclusion?",
 o:["Insects are needed for most pollination in this species: uncovered flowers made a mean of 42 seeds, but covered flowers only 3","The bag killed the flowers","The plant is wind-pollinated","Insects reduce seed production"],a:0},
{id:"da13",t:"data",s:"iii",type:"mcq",chart:"bags",q:"The covered flowers still made a mean of 3 seeds each. Suggest the most likely explanation.",
 o:["Some self-pollination happened inside the bag (pollen from the flower’s own anthers reached its stigma)","Insects can pass through any bag","Seeds can form without any pollination at all in every plant","The scientists counted wrong"],a:0,
 ex:"A mesh bag stops insects, but pollen from the same flower can still reach the stigma: self-pollination. (Very tiny insects or wind-blown pollen getting through are other possible answers, which is why bag design matters.)"},
{id:"da14",t:"data",s:"iii",type:"mcq",chart:"germ",q:"Which is the best description of the germination data?",
 o:["Germination increases from 5% at 5 °C to a peak of 92% at 25 °C, then falls sharply to 10% at 40 °C; the optimum is about 25 °C","Germination increases as temperature increases","The hotter it is, the fewer seeds germinate","Germination is the same at all temperatures"],a:0,
 ex:"This graph has a <b>peak (optimum)</b>, not a plateau. Describe both sides of it with numbers. Very high temperatures damage the seed’s enzymes."},
{id:"da15",t:"data",s:"iii",type:"mcq",q:"Which is the best <b>hypothesis</b> for the paper helicopter investigation?",
 o:["If wing length increases, the fall time will increase, because larger wings create more air resistance, slowing the fall","Helicopters fall","The helicopter with the longest wings will win","Wing length affects something"],a:0,
 ex:"A good hypothesis = a testable prediction (If… then…) + a scientific reason (because…)."},
// ---------------- COMMAND TERMS ----------------
{id:"cm1",t:"cmd",s:"i",type:"match",q:"Match each command term to what it asks you to do.",
 pairs:[["State","Give a specific name, value or short answer, with no explanation"],["Outline","Give a brief account or summary"],["Describe","Give a detailed account of a situation, event, pattern or process"],["Apply","Use knowledge and understanding in a given situation"],["Analyse","Break down information to find key parts and relationships, and reach conclusions"],["Justify","Give valid reasons or evidence to support an answer"]]},
{id:"cm2",t:"cmd",s:"i",type:"mcq",q:"Which command term asks for <b>more</b>: ‘state’ or ‘describe’?",
 o:["Describe: it needs a detailed account; state only needs a short answer","State: it needs reasons","They need the same amount","State: it needs a diagram"],a:0},
{id:"cm3",t:"cmd",s:"i",type:"mcq",q:"Question: “<b>State</b> the function of the anther. [1 mark]” Which answer is best?",
 o:["It makes pollen.","The anther is part of the stamen, which is the male part of the flower, and it is held up by the filament…","Pollen.","It catches pollen."],a:0,
 ex:"‘State’ = short and specific. The second answer wastes time and never says the function. ‘Pollen.’ alone names a thing, not a function. ‘Catches pollen’ is the stigma."},
{id:"cm4",t:"cmd",s:"i",type:"mcq",q:"Question: “<b>Describe</b> how an egg cell is adapted to its function.” Which answer would reach the <b>highest</b> level?",
 o:["The egg has a large food store in its cytoplasm, which gives the zygote energy to divide until it implants; its membrane changes after one sperm enters, so no other sperm can get in and the zygote has exactly 46 chromosomes; its nucleus has 23 chromosomes so the zygote gets the full 46.","The egg is big and has food.","The egg has a food store, a membrane and a nucleus.","An egg is the female gamete made in the ovaries."],a:0,
 ex:"Level 7–8 ‘describe’ = several features, each linked to <b>what it does</b> and <b>why it matters</b> (“which…”, “so that…”). Answer 3 only lists parts (about level 3–4)."},
{id:"cm5",t:"cmd",s:"i",type:"mcq",q:"A question says “<b>Justify</b> your answer.” What must you include?",
 o:["Valid reasons or evidence (data or scientific knowledge) that support your answer","Only your final answer","A labelled diagram","A list of key words"],a:0},
{id:"cm6",t:"cmd",s:"i",type:"mcq",q:"Strand <b>iii</b> of Criterion A is about…",
 o:["Analysing information (data) to make scientifically supported judgments","Recalling definitions","Labelling diagrams","Writing a method"],a:0,
 ex:"Strand i = describe knowledge. Strand ii = apply knowledge to solve problems (familiar and unfamiliar). Strand iii = analyse information/data."},
{id:"cm7",t:"cmd",s:"i",type:"mcq",q:"Which is the best example of <b>constructive</b> feedback?",
 o:["“Your description of the placenta lists the villi, but explain WHY they help, e.g. they increase surface area so diffusion is faster.”","“Good job!”","“This is wrong.”","“Write more.”"],a:0,
 ex:"Constructive feedback says what to improve AND how."},
{id:"cm8",t:"cmd",s:"ii",type:"mcq",q:"A 7–8 level answer about data must do more than describe the trend. Which extra things does the rubric ask for?",
 o:["Identify key features like plateaus, evaluate whether the conclusion is valid, and suggest specific improvements to the method","Draw a bigger graph","Repeat the question in your own words","Write at least one page"],a:0},
// ================= EXTRA WRITTEN ANSWERS =================
{id:"as11",t:"asex",s:"ii",type:"written",q:"A farmer can grow potatoes from <b>tubers</b> (asexual) or from <b>seeds</b> (sexual). <b>Evaluate</b> both methods and justify which the farmer should use to grow a reliable crop. <span class='mk'>[5 marks]</span>",
 marks:[{p:"Tubers produce clones: genetically identical to the parent",k:["clone|identical|same genes"]},
  {p:"So every plant keeps the parent’s good features (yield, taste) / the crop is predictable; it is also faster",k:["good|same feature|same quality|predict|reliab|fast|quick|uniform|yield|taste"]},
  {p:"Risk of tubers: no variation, so one disease or change could kill the whole crop",k:["disease|pest|fungus|blight|change|wipe|all die|whole crop"]},
  {p:"Seeds give variation: some plants may resist disease, but their features are unpredictable or may be worse",k:["seed","vari|differ|unpredict"]},
  {p:"A justified judgement (e.g. tubers for a reliable crop, but grow several varieties to reduce disease risk)",k:["should|recommend|best|choose|better|i think|overall"]}],
 model:"Growing from <b>tubers</b> is asexual reproduction, so every new plant is a <b>clone</b> with the same genes as the parent. The farmer knows the crop will keep the same good features, such as high yield and good taste, and it grows faster than from seed. However, there is <b>no variation</b>, so if a new disease (like potato blight) appears that the parent cannot resist, the <b>whole crop could die</b>. Growing from <b>seeds</b> is sexual reproduction, so the plants show <b>variation</b>: some might resist a disease, but their features are unpredictable and many may be worse. Overall the farmer <b>should use tubers</b> for a reliable crop, but plant several different varieties so one disease cannot wipe out everything."},
{id:"as12",t:"asex",s:"i",type:"written",q:"<b>Explain</b> why identical twins are clones of <b>each other</b> but are <b>not</b> clones of their parents. <span class='mk'>[4 marks]</span>",
 marks:[{p:"A clone is genetically identical (same genes / DNA)",k:["identical|same genes|same dna|same genetic"]},
  {p:"Identical twins come from ONE zygote (one egg + one sperm) that splits into two",k:["one zygote|single zygote|one egg|same zygote|split|divid"]},
  {p:"So both twins have exactly the same genes as each other",k:["same genes|identical genes|same dna|same genetic|genetically identical"]},
  {p:"Not clones of the parents: the zygote has a new mix of genes, 23 chromosomes from each parent",k:["mix|half|23|both parents|each parent|combin"]}],
 model:"A clone is an organism that is <b>genetically identical</b> to another. Identical twins form when <b>one zygote</b> (one egg fertilised by one sperm) <b>splits into two</b> early in development, so both twins have <b>exactly the same genes</b> and are clones of each other. However, that zygote was made by sexual reproduction: it got <b>23 chromosomes from the father’s sperm and 23 from the mother’s egg</b>, a new <b>mix</b> of genes. So the twins are not identical to either parent, and they are not clones of them."},
{id:"hu19",t:"human",s:"i",type:"written",q:"<b>Describe</b> the function of each of these parts of the female reproductive system: ovary, oviduct, uterus, cervix and vagina. <span class='mk'>[5 marks]</span>",
 marks:[{p:"Ovary: contains eggs and releases one mature egg about every 28 days (ovulation)",k:["ovar","egg"]},
  {p:"Oviduct: carries the egg to the uterus; where fertilisation happens",k:["oviduct|fallopian","fertili|carr|mov|transport"]},
  {p:"Uterus: where the embryo implants and the fetus develops (thick lining)",k:["uterus|womb","implant|develop|grow|fetus|baby|embryo"]},
  {p:"Cervix: ring of muscle at the neck of the uterus; holds the baby in and widens during birth",k:["cervix","muscle|ring|entrance|neck|widen|dilat|open|hold"]},
  {p:"Vagina: receives sperm during sex / is the birth canal",k:["vagina","sperm|penis|birth"]}],
 model:"The <b>ovaries</b> contain eggs and release one mature egg about every 28 days at ovulation. The <b>oviduct</b> carries the egg towards the uterus, and it is where <b>fertilisation</b> happens if sperm are present. The <b>uterus</b> is a muscular organ with a thick lining where the embryo <b>implants</b> and the fetus grows. The <b>cervix</b> is a ring of muscle at the neck of the uterus that keeps the baby in during pregnancy and <b>widens</b> during birth. The <b>vagina</b> is where sperm are deposited during sex, and it is the <b>birth canal</b>."},
{id:"hu20",t:"human",s:"ii",type:"written",q:"<b>Compare</b> a human sperm cell and an egg cell. Include at least one similarity and several differences. <span class='mk'>[5 marks]</span>",
 marks:[{p:"Similarity: both are gametes with 23 chromosomes (half the normal number)",k:["23|half|both.{0,40}gamete|both.{0,40}chromosome"]},
  {p:"Size: sperm is tiny; egg is much larger (largest human cell)",k:["small|tiny|large|big"]},
  {p:"Number: millions of sperm released vs usually one egg a month",k:["million|many|one egg|1 egg|single egg|a month|monthly"]},
  {p:"Movement: sperm swims with a tail; egg cannot move by itself (moved along the oviduct by cilia)",k:["tail|swim|flagell"]},
  {p:"Energy: egg has a large food store; sperm has many mitochondria and no food store",k:["food|yolk|cytoplasm|mitochond"]}],
 model:"Both sperm and egg cells are <b>gametes</b> and both contain <b>23 chromosomes</b>, half the number in a body cell, so the zygote gets 46. However, a sperm cell is <b>tiny</b> and streamlined, whereas the egg is <b>much larger</b>, the biggest cell in the body. Men release <b>millions</b> of sperm at a time, whereas a woman usually releases <b>one egg a month</b>. A sperm <b>swims using its tail</b>, whereas an egg cannot move by itself and is moved along the oviduct by cilia. The egg has a <b>large food store</b> to feed the embryo, whereas the sperm has <b>many mitochondria</b> to release energy for swimming but no food store."},
{id:"hu21",t:"human",s:"ii",type:"written",q:"<b>Unfamiliar situation.</b> A man makes normal numbers of sperm, but his sperm cannot swim. Doctors can inject one sperm directly into an egg in a lab, then place the embryo in the woman’s uterus. <b>Explain</b> why the couple could not have a baby naturally, and why this treatment works. <span class='mk'>[4 marks]</span>",
 marks:[{p:"Naturally, sperm must swim (using the tail) from the vagina through the uterus to the egg in the oviduct",k:["swim|tail|travel","oviduct|egg|uterus|reach"]},
  {p:"So sperm that cannot swim never reach the egg, and fertilisation cannot happen",k:["can.?t reach|cannot reach|never reach|not reach|unable to reach|no fertili|can.?t fertili|cannot fertili|won.?t fertili|can.?t get to|cannot get to"]},
  {p:"Injecting the sperm puts its nucleus inside the egg, so the nuclei can fuse to form a zygote",k:["inject|inside|directly","fus|zygote|fertili|nucle"]},
  {p:"The embryo is placed in the uterus so it can implant in the lining and develop",k:["implant|lining"]}],
 model:"In natural reproduction, sperm must <b>swim</b> using their tails from the vagina, through the cervix and uterus, to reach the egg in the <b>oviduct</b>. If the sperm cannot swim, they <b>never reach the egg</b>, so fertilisation cannot happen even though there are plenty of sperm. Injecting one sperm <b>directly into the egg</b> skips the journey: the sperm nucleus is already inside, so it can <b>fuse</b> with the egg nucleus to make a <b>zygote</b>. The embryo is then placed in the <b>uterus</b>, where it can <b>implant</b> in the thick lining and develop normally."},
{id:"cy17",t:"cycle",s:"i",type:"written",q:"<b>Describe</b> the main events of a 28-day menstrual cycle. <span class='mk'>[5 marks]</span>",
 marks:[{p:"Days 1–5: menstruation: the uterus lining breaks down and leaves through the vagina (the period)",k:["menstruat|period|bleed","lining|shed|break"]},
  {p:"The lining then rebuilds / thickens (with blood vessels)",k:["thick|rebuild|build|grow"]},
  {p:"An egg matures in the ovary (follicular phase)",k:["matur|develop|follic","egg"]},
  {p:"Ovulation on about day 14: an egg is released from the ovary",k:["ovulat|release","14"]},
  {p:"Days 15–28: the lining is kept thick for implantation; if there is no fertilisation it breaks down and the cycle restarts",k:["luteal|15|28|maintain|kept|stay|no fertili|not fertili|restart|repeat|again"]}],
 model:"On <b>days 1–5</b> the thick <b>uterus lining breaks down</b> and leaves the body through the vagina: this is <b>menstruation</b>. From then until day 13 (the follicular phase) an <b>egg matures</b> in the ovary and the uterus lining <b>rebuilds and thickens</b>. On about <b>day 14</b>, <b>ovulation</b> happens: the mature egg is released from the ovary into the oviduct. During the <b>luteal phase (days 15–28)</b> the lining is kept thick and full of blood vessels, ready for an embryo to implant. If the egg is <b>not fertilised</b>, the lining breaks down again and a new cycle starts."},
{id:"cy18",t:"cycle",s:"ii",type:"written",q:"Lena has a regular <b>30-day</b> cycle. Her period started on <b>3 May</b>. Calculate the date she is likely to ovulate and the dates of her fertile window. Show your working and <b>explain</b> each step. <span class='mk'>[4 marks]</span>",
 marks:[{p:"Ovulation day = cycle length − 14 = day 16 (the luteal phase is about 14 days)",k:["16"]},
  {p:"Day 1 = 3 May, so day 16 = 18 May",k:["18(th)? ?(of )?may|may ?18"]},
  {p:"Sperm survive up to ~5 days and the egg ~1 day, so the window is about days 11–17",k:["5 days|five days|\\b11\\b","1 day|one day|24|\\b17\\b"]},
  {p:"Fertile window ≈ 13 May to 19 May",k:["13(th)? ?(of )?may|may ?13","19(th)? ?(of )?may|may ?19"]}],
 model:"The luteal phase is about 14 days, so ovulation ≈ 30 − 14 = <b>day 16</b>. Day 1 is 3 May, so day 16 is 3 May + 15 days = <b>18 May</b>. Sperm can survive up to about <b>5 days</b>, so sex from day 11 could still lead to fertilisation, and the egg survives about <b>1 day</b>, until day 17. So the fertile window is about days 11–17, which is <b>13 May to 19 May</b>."},
{id:"cy19",t:"cycle",s:"i",type:"written",q:"<b>Describe</b> what happens from ovulation to implantation. Use the words <i>oviduct</i>, <i>nuclei</i>, <i>zygote</i> and <i>implantation</i>. <span class='mk'>[5 marks]</span>",
 marks:[{p:"Ovulation: a mature egg is released from the ovary into the oviduct",k:["releas|ovulat","oviduct|fallopian"]},
  {p:"Sperm swim through the cervix and uterus into the oviduct; one sperm enters the egg",k:["sperm","swim|enter|reach|penetrat"]},
  {p:"The sperm and egg nuclei fuse (fertilisation), making a zygote",k:["nucle|fus|fertili","zygote"]},
  {p:"The zygote divides into a ball of cells (embryo) as it moves to the uterus",k:["divid|ball of cells|embryo|multiply"]},
  {p:"Implantation: the embryo embeds in the thick uterus lining",k:["implant|embed","lining|uterus"]}],
 model:"At <b>ovulation</b> a mature egg is released from the ovary into the <b>oviduct</b>. Sperm swim from the vagina, through the cervix and uterus, into the oviduct, where <b>one sperm enters the egg</b>. The sperm and egg <b>nuclei fuse</b>; this is fertilisation, and it forms a single cell called a <b>zygote</b>. The zygote <b>divides</b> into a ball of cells (an embryo) as it travels down the oviduct over several days. Finally, in <b>implantation</b>, the embryo embeds itself in the thick, blood-rich <b>uterus lining</b>."},
{id:"pr17",t:"preg",s:"i",type:"written",q:"<b>Describe</b> how the placenta is adapted to exchange substances between the mother and the fetus. <span class='mk'>[5 marks]</span>",
 marks:[{p:"Villi give a large surface area",k:["vill|finger","surface"]},
  {p:"Thin barrier / short distance between the two bloods, so diffusion is fast",k:["thin|short distance|close"]},
  {p:"Rich blood supply on both sides keeps substances moving away",k:["blood supply|blood vessel|capillar|lots of blood|rich"]},
  {p:"Substances move by diffusion; the bloods do not mix",k:["diffus|not mix|don.?t mix|doesn.?t mix|never mix|separate"]},
  {p:"Names exchanges: oxygen and nutrients (glucose) to the fetus; CO₂ and urea to the mother",k:["oxygen|glucose|nutrient|amino","carbon dioxide|co2|co₂|urea|waste"]}],
 model:"The placenta is covered in thousands of finger-like <b>villi</b>, which give it a very <b>large surface area</b> for exchange. The barrier between the mother’s blood and the fetus’s blood is very <b>thin</b>, so substances only have a <b>short distance to diffuse</b>. There is a <b>rich blood supply</b> on both sides, which carries substances away quickly so diffusion keeps going. The two bloods <b>do not mix</b>: <b>oxygen, glucose and amino acids diffuse</b> from the mother to the fetus, while <b>carbon dioxide and urea</b> diffuse from the fetus to the mother."},
{id:"pr18",t:"preg",s:"ii",type:"written",q:"<b>Explain</b> why pregnant women are advised not to drink alcohol, especially in the first trimester. <span class='mk'>[4 marks]</span>",
 marks:[{p:"Alcohol can cross the placenta (it is not a perfect barrier)",k:["cross|pass|through|diffus|get","placenta"]},
  {p:"It reaches the fetus’s blood through the umbilical cord",k:["blood|umbilical|cord"]},
  {p:"In the first trimester the organs (brain, heart…) are forming",k:["organ|brain|heart","form|develop|grow"]},
  {p:"So damage can be permanent, e.g. birth defects, brain damage, low birth mass",k:["damage|harm|defect|permanent|problem|low birth|miscarr"]}],
 model:"The placenta is not a perfect barrier: <b>alcohol can cross the placenta</b> by diffusion and enter the fetus’s blood through the <b>umbilical cord</b>. In the <b>first trimester</b> all the major <b>organs</b>, including the brain and heart, are forming, so this is when the embryo is most sensitive. Alcohol can <b>damage the developing organs</b>, which can cause permanent problems such as brain damage, birth defects and low birth mass."},
{id:"pr19",t:"preg",s:"i",type:"written",q:"<b>Outline</b> what happens in each trimester of pregnancy and at birth. <span class='mk'>[4 marks]</span>",
 marks:[{p:"Trimester 1 (weeks 1–12): implantation, placenta forms, heart beats, organs form; becomes a fetus at week 9",k:["first|1st|one|1.12","organ|heart|placenta|implant"]},
  {p:"Trimester 2 (weeks 13–26): the fetus grows quickly and starts moving (the mother feels kicks)",k:["second|2nd|two|13","grow|mov|kick|hear"]},
  {p:"Trimester 3 (weeks 27–40): rapid weight gain / fat, lungs mature, turns head-down",k:["third|3rd|three|27","lung|weight|fat|head"]},
  {p:"Birth (~40 weeks): cervix widens, uterus contracts, baby pushed out through the vagina, then the placenta",k:["birth|born|labou?r","cervix|contract|push|vagina|placenta|afterbirth"]}],
 model:"<b>Trimester 1 (weeks 1–12):</b> the embryo implants, the placenta forms, the heart starts beating and all the main organs form; from week 9 it is called a fetus. <b>Trimester 2 (weeks 13–26):</b> the fetus grows quickly and starts to move, so the mother feels kicks. <b>Trimester 3 (weeks 27–40):</b> it gains weight rapidly, stores fat, its lungs mature and it turns head-down. <b>Birth (about week 40):</b> the cervix widens, the uterus muscles contract to push the baby out through the vagina, and then the placenta comes out as the afterbirth."},
{id:"fl18",t:"flower",s:"i",type:"written",q:"<b>Describe</b> the structure and function of the <b>stamen</b> and the <b>carpel</b>. <span class='mk'>[5 marks]</span>",
 marks:[{p:"The stamen is the male part, made of an anther and a filament",k:["stamen","anther","filament"]},
  {p:"The anther makes pollen (containing the male gamete); the filament holds the anther up",k:["pollen","make|produc"]},
  {p:"The carpel is the female part, made of stigma, style and ovary",k:["carpel","stigma","style","ovary"]},
  {p:"The stigma is sticky to catch pollen; the pollen tube grows down the style",k:["stick|catch|trap","tube|style"]},
  {p:"The ovary contains ovules (female gametes); ovary → fruit, ovules → seeds",k:["ovule","seed|fruit|female gamete"]}],
 model:"The <b>stamen</b> is the male part of the flower and is made of an <b>anther</b> on a stalk called the <b>filament</b>. The anther <b>makes pollen</b>, which contains the male gamete, and the filament holds it up so the pollen can be picked up by insects or wind. The <b>carpel</b> is the female part, made of the <b>stigma, style and ovary</b>. The <b>stigma is sticky</b> to catch pollen, and the <b>style</b> connects it to the ovary; the pollen tube grows down it. The <b>ovary contains ovules</b>, which hold the female gametes; after fertilisation the ovules become <b>seeds</b> and the ovary becomes the <b>fruit</b>."},
{id:"fl19",t:"flower",s:"ii",type:"written",q:"<b>Compare</b> insect-pollinated and wind-pollinated flowers. <span class='mk'>[5 marks]</span>",
 marks:[{p:"Petals: large and brightly coloured (insect) vs small, dull/green or none (wind)",k:["petal","bright|colou?r|large|big","small|dull|green|no petal|none"]},
  {p:"Scent and nectar in insect-pollinated; none in wind-pollinated",k:["scent|smell|nectar"]},
  {p:"Anthers inside the flower (insect) vs hanging outside on long filaments (wind)",k:["anther","inside|outside|hang"]},
  {p:"Stigma sticky and inside (insect) vs feathery and outside (wind)",k:["stigma","feather|stick"]},
  {p:"Pollen: small amounts, sticky/spiky (insect) vs huge amounts, light and smooth (wind)",k:["pollen","sticky|spiky|light|smooth|lot|large amount|huge|small amount|less|more"]}],
 model:"Insect-pollinated flowers have <b>large, brightly coloured petals</b>, whereas wind-pollinated flowers have <b>small, dull or green petals</b> or none. Insect-pollinated flowers produce <b>scent and nectar</b> to attract insects, whereas wind-pollinated flowers have none. In insect-pollinated flowers the <b>anthers are inside</b> the flower so they brush against the insect, whereas in wind-pollinated flowers they <b>hang outside on long filaments</b>. The stigma is <b>sticky and inside</b> an insect-pollinated flower, but <b>feathery and outside</b> a wind-pollinated one. Insect-pollinated flowers make <b>small amounts of sticky or spiky pollen</b>, whereas wind-pollinated flowers make <b>huge amounts of light, smooth pollen</b>, because most of it is wasted."},
{id:"fl20",t:"flower",s:"i",type:"written",q:"<b>Describe</b> how to dissect a flower safely and record what you see in an observational drawing. <span class='mk'>[5 marks]</span>",
 marks:[{p:"Observe the whole flower first (e.g. with a hand lens) before cutting",k:["hand lens|observ|look|magnif"]},
  {p:"Remove the parts from the outside in: sepals, petals, stamens, then carpel (with tweezers), and count them",k:["outside|outer|sepal","petal|stamen|carpel|tweezer"]},
  {p:"Safety: cut on a white tile, away from your body and fingers",k:["tile|away from"]},
  {p:"More safety: carry the scalpel blade down, report cuts, wash hands",k:["report|wash|blade|point down|downward"]},
  {p:"Drawing: sharp pencil, clear lines, no shading, ruled label lines that don’t cross, a title",k:["pencil|shading|ruler|label|title"]}],

{id:"po18",t:"poll",s:"ii",type:"written",q:"<b>Explain</b> the difference between self-pollination and cross-pollination, and why cross-pollination can benefit a plant species. <span class='mk'>[4 marks]</span>",
 marks:[{p:"Self-pollination: pollen goes to a stigma on the same flower or the same plant",k:["self","same (flower|plant)"]},
  {p:"Cross-pollination: pollen goes to a stigma on a different plant of the same species",k:["cross","different plant|another plant|other plant"]},
  {p:"Cross-pollination combines genes from two different plants, creating more variation",k:["vari|mix|combin"]},
  {p:"Variation means some offspring may survive disease or environmental change",k:["surviv|disease|change|adapt"]}],

{id:"po19",t:"poll",s:"ii",type:"written",q:"<b>Describe</b> how a sycamore seed and a cherry are each adapted for seed dispersal, and why dispersal matters. <span class='mk'>[4 marks]</span>",

{id:"po20",t:"poll",s:"ii",type:"written",q:"<b>Compare</b> the life cycle of a flowering plant with the life cycle of a human. <span class='mk'>[4 marks]</span>",
