  {p:"Similarity: both grow and develop into an adult that can reproduce, and the cycle repeats",k:["grow|develop|adult|matur|repeat|cycle"]},
  {p:"Difference: plants can’t move, so pollen is carried by wind/insects; humans find a mate (internal fertilisation)",k:["pollen|pollinat|insect|wind","mate|internal|move"]},

{id:"po21",t:"poll",s:"i",type:"written",q:"<b>Explain</b> why a seed needs water, oxygen and warmth to germinate. <span class='mk'>[4 marks]</span>",

  {p:"Respiration releases energy for growth",k:["energy"]},

{id:"dn19",t:"dna",s:"i",type:"written",q:"<b>Describe</b> how a cell, nucleus, chromosome, gene and DNA are related to each other. <span class='mk'>[5 marks]</span>",

{id:"dn20",t:"dna",s:"ii",type:"written",q:"<b>Explain</b> why a child looks a bit like both parents but is not identical to either of them. <span class='mk'>[4 marks]</span>",

  {p:"At fertilisation they fuse, so the zygote has 46: genes from both parents",k:["fus|fertili|46|combin"]},

  {p:"The combination of genes is new (each gamete carries a different mix), so the child is unique: variation",k:["mix|combin|unique|vari|different"]}],

asex:`
<h3>Why reproduce?</h3>
<p>Every living thing eventually dies. <b>Reproduction</b> (producing new <b>offspring</b> of the same species) is the only way a species carries on. There are two very different strategies.</p>
<div class="two">
<div class="box blue"><h4>Asexual reproduction</h4><ul><li><b>One</b> parent</li><li><b>No gametes</b>, no fertilisation</li><li>Offspring are <b>genetically identical</b> to the parent = <b>clones</b></li></ul></div>
<div class="box pink"><h4>Sexual reproduction</h4><ul><li>Usually <b>two</b> parents</li><li><b>Gametes</b> (sex cells) fuse at <b>fertilisation</b></li><li>Offspring get a <b>mix</b> of genetic material, so they show <b>variation</b></li></ul></div></div>
<h3>Examples to know</h3>
<table><tr><th>Organism</th><th>How</th><th>Type</th></tr>
<tr><td>Bacteria</td><td>Split in two (binary fission), as often as every 20 minutes</td><td>Asexual</td></tr>
<tr><td>Potato</td><td>New plants grow from tubers</td><td>Asexual (also makes seeds)</td></tr>
<tr><td>Strawberry</td><td>Runners (asexual) <b>and</b> seeds from flowers (sexual)</td><td>Both!</td></tr>
<tr><td>Yeast</td><td>Budding</td><td>Asexual</td></tr>
<tr><td>Starfish</td><td>A broken arm with part of the centre can regrow a whole starfish; also releases eggs and sperm</td><td>Both!</td></tr>
<tr><td>Humans, ladybirds</td><td>Sperm + egg</td><td>Sexual</td></tr></table>
<h3>Advantages and disadvantages</h3>
<table><tr><th></th><th>Advantages</th><th>Disadvantages</th></tr>
<tr><td><b>Asexual</b></td><td>Fast; lots of offspring; no mate needed (saves time and energy); good offspring for a stable environment that suits the parent</td><td>No variation, so a new disease or a change in the environment could kill them all</td></tr>
<tr><td><b>Sexual</b></td><td>Variation, so some offspring may survive if the environment changes or a disease appears</td><td>Slower; needs a mate (time and energy); fewer offspring</td></tr></table>
<div class="trap"><b>Exam traps</b><ul>
<li>Strawberries and starfish can reproduce <b>both</b> ways.</li>

cycle:`
<h3>The menstrual cycle (about 28 days)</h3>
<p>A roughly monthly cycle that prepares the body for pregnancy. <b>Day 1 = the first day of the period.</b></p>
<table><tr><th>Phase</th><th>Days</th><th>What happens</th></tr>
<tr><td><b>Menstruation</b></td><td>1–5</td><td>The uterus lining breaks down and leaves the body through the vagina (the period)</td></tr>
<tr><td><b>Follicular</b></td><td>1–13</td><td>An egg matures inside the ovary; the uterus lining starts to rebuild and thicken</td></tr>
<tr><td><b>Ovulation</b></td><td>14</td><td>A mature egg is released from an ovary into the oviduct</td></tr>
<tr><td><b>Luteal</b></td><td>15–28</td><td>The lining is kept thick with lots of blood vessels, ready for an embryo. If no implantation → lining breaks down → new cycle</td></tr></table>
<h3>The fertile window</h3>
<ul><li>An egg survives about <b>12–24 hours</b> after ovulation.</li><li>Sperm can survive up to about <b>5 days</b> inside the female body.</li><li>So fertilisation is possible from about <b>day 9 to day 15</b> of a 28-day cycle.</li></ul>
<div class="tip"><b>Unfamiliar cycle lengths:</b> the luteal phase is fairly fixed at ~14 days, so <b>ovulation day ≈ cycle length − 14</b>.<br>28-day cycle → day 14 · 32-day → day 18 · 24-day → day 10.<br><b>Date maths:</b> Day N = start date + (N − 1) days. Period on 1 March → day 14 = 14 March.</div>
<div class="widget" id="w-cycle"><b>🧮 Try it: cycle calculator</b><br><br>
<label>Period start</label><input type="date" id="cyStart" value="2026-03-01"> &nbsp; <label>Cycle length</label><input type="number" id="cyLen" value="28" min="21" max="40" style="width:70px"> days
<div id="cyOut" style="margin-top:10px"></div></div>
<h3>From egg to implantation</h3>
<ol><li><b>Ovulation:</b> egg released from the ovary into the oviduct.</li>
<li><b>Sperm swim</b> from the vagina, through the cervix and uterus, into the oviduct. Millions start; only a few hundred get near the egg.</li>

<li><b>Fertilisation:</b> sperm and egg <b>nuclei fuse</b> → a <b>zygote</b> (one cell, 46 chromosomes).</li>
<li>The zygote divides into a ball of cells (embryo) as it moves down the oviduct (about 5–7 days).</li>
<li><b>Implantation:</b> the embryo embeds in the thick uterus lining. The lining is kept, so periods stop.</li></ol>
<p><b>Twins:</b> identical = one zygote splits into two (same genes). Non-identical = two eggs fertilised by two sperm (different genes).</p>

preg:`
<h3>Names by stage</h3>
<table><tr><th>Name</th><th>When</th></tr><tr><td><b>Zygote</b></td><td>The single fertilised cell</td></tr><tr><td><b>Embryo</b></td><td>First 8 weeks</td></tr><tr><td><b>Fetus</b></td><td>From week 9 until birth</td></tr></table>
<h3>The placenta: a temporary organ</h3>
<p>The placenta grows into the uterus wall after implantation. The mother’s blood and the fetus’s blood come very close but <b>do not mix</b>. Substances cross by <b>diffusion</b>.</p>
<div class="two"><div class="box green"><h4>Mother → fetus</h4><ul><li>Oxygen</li><li>Glucose (and other nutrients)</li><li>Amino acids</li><li>Water, minerals</li><li>Antibodies (protection from disease)</li></ul></div>
<div class="box amber"><h4>Fetus → mother</h4><ul><li>Carbon dioxide</li><li>Urea (waste)</li></ul></div></div>
<p><b>Adapted for exchange:</b> thousands of finger-like <b>villi</b> → large surface area; <b>thin barrier</b> → short diffusion distance; <b>rich blood supply</b> on both sides → substances keep moving away, so diffusion stays fast.</p>
<p><b>Why the bloods don’t mix:</b> the mother’s blood pressure is higher and could damage the fetus’s vessels; their blood groups may not match; the barrier blocks many harmful substances. <b>But</b> some still cross: alcohol, nicotine, carbon monoxide, some drugs and some viruses (rubella, Zika).</p>
<p><b>Umbilical cord:</b> contains blood vessels connecting the fetus to the placenta (not to the mother directly). <b>Amniotic fluid</b> (in the amniotic sac) cushions the fetus from bumps and lets it move.</p>
<h3>The three trimesters</h3>
<table><tr><th>Stage</th><th>What happens</th></tr>
<tr><td><b>Trimester 1</b> (weeks 1–12)</td><td>Implantation; placenta forms; heart starts beating (~week 5–6); all major organs form; called a fetus from week 9. <b>Most vulnerable</b> to alcohol, drugs, infections</td></tr>
<tr><td><b>Trimester 2</b> (weeks 13–26)</td><td>Grows quickly; mother feels movements; can hear sounds; fine hair on body</td></tr>
<tr><td><b>Trimester 3</b> (weeks 27–40)</td><td>Rapid weight gain, fat stored; <b>lungs mature</b>; turns head-down</td></tr>
<tr><td><b>Birth</b> (~week 40)</td><td>Cervix widens (dilates); strong contractions of the uterus muscle push the baby out through the vagina; cord is cut (belly button); the placenta comes out afterwards (‘afterbirth’)</td></tr></table>
<div class="trap"><b>Exam traps</b><ul><li>Blood does NOT mix; substances <b>diffuse</b>.</li><li>CO₂ and urea go fetus → mother, not the other way.</li><li>The fetus doesn’t breathe air: its oxygen comes from the placenta. That’s why babies born early struggle to breathe (lungs mature in trimester 3).</li><li>Smoking: carbon monoxide crosses the placenta and reduces oxygen → lower birth mass.</li></ul></div>
<div class="model"><b>Big Question model answer:</b> A developing baby gets everything it needs through the <b>placenta</b>, where oxygen and nutrients diffuse from the mother’s blood into the fetus’s blood, and carbon dioxide and urea diffuse the other way, without the bloods mixing. The <b>umbilical cord</b> carries this blood between the <b>fetus</b> and the placenta, and over three <b>trimesters</b> the organs form, the fetus grows and the lungs mature, ready for birth.</div>`,
flower:`
<h3>What is a flower for?</h3>
<p>A flower is the <b>sexual reproductive organ</b> of a flowering plant. Its job is to make gametes, get pollinated, and produce seeds.</p>
<div class="fig">${FIGS.flower}</div>
<p class="small mute">Key: A stigma · B style · C ovary · D ovule · E anther · F filament · G petal · H sepal · I nectary</p>
<table><tr><th>Part</th><th>Male/Female</th><th>Function</th></tr>
<tr><td><b>Sepal</b></td><td>–</td><td>Small, green, leaf-like; protects the flower when it’s a bud</td></tr>
<tr><td><b>Petal</b></td><td>–</td><td>Often bright and scented, to attract insects</td></tr>
<tr><td><b>Nectary</b></td><td>–</td><td>At the base of the petals; makes sugary nectar to attract insects</td></tr>
<tr><td><b>Stamen</b> = anther + filament</td><td>Male</td><td><b>Anther</b> makes pollen (which contains the male gamete). <b>Filament</b> holds the anther up</td></tr>
<tr><td><b>Carpel</b> = stigma + style + ovary</td><td>Female</td><td><b>Stigma</b>: sticky top that catches pollen. <b>Style</b>: connects stigma to ovary; the pollen tube grows down it. <b>Ovary</b>: contains ovules; becomes the <b>fruit</b></td></tr>
<tr><td><b>Ovule</b></td><td>Female</td><td>Inside the ovary; contains the female gamete; becomes the <b>seed</b></td></tr></table>
<p><b>Order from outside to centre:</b> sepals → petals → stamens → carpel. Dissect in this order, so outer parts don’t hide or crush the inner parts.</p>
<h3>Insect-pollinated vs wind-pollinated</h3>
<table><tr><th>Feature</th><th>Insect-pollinated 🐝</th><th>Wind-pollinated 🌬️</th></tr>
<tr><td>Petals</td><td>Large, bright, often with guide lines/spots</td><td>Small, dull/green, or none</td></tr>
<tr><td>Scent & nectar</td><td>Yes</td><td>No</td></tr>
<tr><td>Anthers</td><td>Inside the flower, firmly attached</td><td>Hang <b>outside</b> on long filaments</td></tr>
<tr><td>Stigma</td><td>Inside, sticky</td><td><b>Feathery</b>, hanging outside (a net to catch pollen)</td></tr>
<tr><td>Pollen</td><td>Small amounts; larger, <b>sticky or spiky</b> grains</td><td><b>Huge amounts</b>; small, light, smooth grains</td></tr>
<tr><td>Examples</td><td>Foxglove, rose, sunflower</td><td>Grass, wheat, maize, oak</td></tr></table>
<h3>Dissection lab essentials</h3>
<ul><li><b>Safety:</b> cut on the white tile, <b>away</b> from your body and fingers; carry scalpels with blades pointing down; report any cut; wash hands at the end.</li>
<li><b>Observational drawing:</b> sharp pencil; clear single lines; <b>no shading</b>; draw what you actually see; label lines drawn with a ruler, no arrowheads, not crossing; title.</li>
<li>Count the parts: e.g. 5 sepals, 5 petals, 10 stamens (= 10 anthers), 1 carpel (= 1 stigma).</li></ul>
<div class="trap"><b>Exam traps</b><ul><li><b>Ovary → fruit, ovule → seed.</b> (Pea pod = ovary, peas = ovules.)</li><li>Pollen <b>contains</b> the male gamete; it isn’t the gamete itself.</li><li>Carpel is the whole female part; the ovary is just its bottom part.</li><li>Stamen = anther + filament (not petal!).</li></ul></div>
<div class="model"><b>Big Question model answer:</b> A flower is the plant’s organ for sexual reproduction. The <b>stamen</b>’s <b>anther</b> makes <b>pollen</b> containing the male gamete, and the <b>carpel</b> contains <b>ovules</b> with the female gametes in the <b>ovary</b>, while the petals and nectar attract insects to carry pollen to the sticky <b>stigma</b>, so fertilisation can produce seeds.</div>`,
poll:`
<h3>Pollination</h3>
<p><b>Pollination</b> = transfer of pollen from an <b>anther</b> to a <b>stigma</b> (of the same species).</p>
<table><tr><th>Self-pollination</th><th>Cross-pollination</th></tr><tr><td>Pollen goes to a stigma on the <b>same flower or the same plant</b>. Less variation.</td><td>Pollen goes to a stigma on a <b>different plant</b> of the same species. <b>More variation</b>.</td></tr></table>
<p>Some plants avoid self-pollination: anthers and stigma ripen at different times, or the stigma sits above the anthers.</p>
<h3>Fertilisation in flowering plants</h3>
<ol><li>Pollen lands on the stigma.</li><li>A <b>pollen tube</b> grows down through the style.</li><li>The tube enters the ovary and reaches an <b>ovule</b>.</li><li>The male gamete nucleus travels down the tube and <b>fuses</b> with the female gamete nucleus = <b>fertilisation</b> → zygote → embryo plant.</li><li>The <b>ovule becomes a seed</b>; the <b>ovary becomes a fruit</b>; petals and stamens wither.</li></ol>
<div class="tip"><b>Pollination ≠ fertilisation.</b> Pollination = <i>moving</i> pollen. Fertilisation = <i>fusing</i> nuclei. Pollination always comes first.</div>
<h3>Seed dispersal</h3>
<table><tr><th>Method</th><th>Adaptation</th><th>Examples</th></tr>
<tr><td>Wind</td><td>Wings (spin, fall slowly) or parachutes of hairs; light</td><td>Sycamore, dandelion</td></tr>
<tr><td>Animal: eaten</td><td>Bright, sweet, fleshy fruit; hard seed coat survives digestion; dropped in droppings far away</td><td>Cherry, blackberry, tomato</td></tr>
<tr><td>Animal: hooks</td><td>Hooks stick to fur, fall off later</td><td>Burdock, goosegrass</td></tr>
<tr><td>Explosive</td><td>Pod dries and bursts, flinging seeds</td><td>Pea, gorse</td></tr>
<tr><td>Water</td><td>Floats, waterproof</td><td>Coconut</td></tr></table>
<p><b>Why disperse?</b> To reduce <b>competition</b> with the parent and each other for <b>light, water, minerals and space</b>; to colonise new areas; so that a disease or disaster in one place doesn’t wipe out the whole species.</p>
<h3>Germination</h3>
<p>When a seed starts to grow. Needs <b>water</b> (swells the seed, activates it), <b>oxygen</b> (for respiration → energy) and <b>warmth</b> (for its enzymes). Most seeds do <b>not</b> need light: they use their food store until the first leaves can photosynthesise.</p>
<h3>Life cycles</h3>
<ul><li><b>Flowering plant:</b> seed → germination → adult plant → flowers → pollination → fertilisation → seeds in fruit → dispersal → (repeat)</li>
<li><b>Human/mammal:</b> fertilisation → embryo → fetus → birth → child → adolescent (puberty) → adult → reproduce</li>
<li><b>Complete metamorphosis</b> (ladybird, butterfly): egg → larva → pupa → adult</li>
<li><b>Frog:</b> egg (spawn) → tadpole → froglet → adult</li></ul>
<p><b>Compare:</b> both plants and animals make gametes that fuse at fertilisation, grow, mature and reproduce. But plants can’t move to find a mate, so they rely on wind or animals for pollination, and on dispersal to spread offspring.</p>
<p><b>Strategies:</b> <i>external</i> fertilisation (most fish, frogs) → huge numbers of eggs, little or no care, most die. <i>Internal</i> fertilisation (mammals, birds) → fewer young, more parental care, more survive.</p>
<h3>Helicopter seed investigation</h3>
<p>Independent variable: <b>wing length</b>. Dependent: <b>fall time</b>. Controls: drop height, paper clip mass, paper type, no draughts. Repeat each 3+ times and take a mean. Improvements: greater drop height or slow-motion video to reduce reaction-time error.</p>
<div class="model"><b>Big Question model answer:</b> First, <b>pollination</b> carries a pollen grain from an anther to a stigma, often by <b>cross-pollination</b> between different plants. A pollen tube grows down to the ovule where <b>fertilisation</b> happens, and the ovule becomes a seed. <b>Seed dispersal</b> by wind, animals, water or explosion carries the seed far away, where <b>germination</b> starts a new plant with less competition.</div>`,
dna:`
<h3>Where is the genetic information?</h3>
<p><b>cell</b> ⟶ contains a <b>nucleus</b> ⟶ contains <b>chromosomes</b> ⟶ each is a long, tightly coiled <b>DNA</b> molecule ⟶ divided into <b>genes</b> ⟶ each gene is a sequence of <b>base pairs</b>.</p>
<ul><li>Human body cells have <b>46 chromosomes</b> (23 pairs: one of each pair from mum, one from dad).</li><li>Gametes have <b>23</b>. At fertilisation 23 + 23 = 46.</li><li>A <b>gene</b> = a short section of DNA that codes for one protein or characteristic.</li></ul>
<h3>Structure of DNA</h3>
<ul><li><b>DNA</b> = deoxyribonucleic acid.</li><li>Building block: the <b>nucleotide</b> = <b>phosphate + sugar (deoxyribose) + base</b>.</li><li>Four bases: <b>A</b> (adenine), <b>T</b> (thymine), <b>C</b> (cytosine), <b>G</b> (guanine).</li><li><b>Base-pairing rule:</b> A always pairs with T; C always pairs with G. (<i>Apple in the Tree, Car in the Garage</i>)</li><li>Two strands twisted into a <b>double helix</b>, like a spiral ladder: sugar–phosphate = the sides; base pairs = the rungs.</li><li>The <b>order</b> of bases is the code.</li></ul>
<div class="widget"><b>🧬 Try it: build the partner strand</b><br><br><label>Strand 1</label><input id="dnaIn" value="ATGCCTAGG" style="width:220px;font-family:monospace;text-transform:uppercase">
<div id="dnaOut" style="margin-top:10px"></div></div>
<h3>Number tricks (Chargaff’s rule)</h3>
<p>Because A = T and C = G: if 30% is A, then T = 30%, so C + G = 40%, and G = 20%.<br>1 base pair = 2 nucleotides. 12 base pairs = 24 nucleotides.</p>
<h3>History: Photo 51</h3>
<p><b>Rosalind Franklin</b> used <b>X-ray diffraction</b> (1952) to make Photo 51. The <b>X-shaped pattern</b> is what a helix produces. <b>Watson and Crick</b> (with Maurice Wilkins’ data) used it to build the double-helix model in 1953.</p>
<div class="trap"><b>Exam traps</b><ul><li>Gene &lt; chromosome. A chromosome contains hundreds or thousands of genes.</li><li>Nucleotide ≠ base pair. A base pair = 2 bases joined across the ladder.</li><li>Variation in sunflower seeds = each seed came from a different fertilisation with a different mix of genes.</li><li>Bacteria have DNA but no nucleus.</li></ul></div>
<div class="model"><b>Big Question model answer:</b> <b>DNA</b> is a <b>double helix</b> made of nucleotides, and the order of its four bases (A, T, C, G) is a code. Sections of DNA called <b>genes</b>, found on the 46 <b>chromosomes</b> in the nucleus, each carry instructions for making a protein, and these proteins build and run the whole body.</div>`,
data:`
<h3>Variables</h3>
<table><tr><th>Variable</th><th>Meaning</th><th>Cuttings example</th><th>Helicopter example</th></tr>
<tr><td>Independent</td><td>What you change</td><td>Number of leaves</td><td>Wing length</td></tr>
<tr><td>Dependent</td><td>What you measure</td><td>Root length (mm)</td><td>Fall time (s)</td></tr>
<tr><td>Control</td><td>Kept the same (fair test)</td><td>Species, stem length, light, temperature, water, days</td><td>Drop height, clip mass, paper type, no draughts</td></tr></table>
<h3>How to analyse data like a level 7–8 scientist</h3>
<ol><li><b>Trend:</b> “As X increases, Y increases/decreases…”</li>
<li><b>Numbers with units:</b> “…from 2 mm at 0 leaves to 24 mm at 4 leaves.”</li>
<li><b>Key features:</b> plateau (levels off), peak/optimum, anomaly, where it changes fastest.</li>
<li><b>Explain with science:</b> “…because leaves photosynthesise, making sugar for growth.”</li>
<li><b>Evaluate the conclusion:</b> is it valid? Is it only true within the range tested? Enough repeats? Correlation ≠ causation.</li>
<li><b>Improve the method (specifically!):</b> “Use 5 cuttings per group”, “keep all at 20 °C”, not “be more careful”.</li></ol>
<div class="fig">${chart(CH.cuttings)}</div>
<div class="model"><b>Worked example:</b> As the number of leaves increases from 0 to 4, mean root length increases from 2 mm to 24 mm. From 4 to 6 leaves the graph plateaus at about 25 mm. Leaves photosynthesise, making sugar that the cutting uses for energy to grow roots, but after 4 leaves another factor (such as water or light) limits growth. The conclusion is only valid from 0 to 6 leaves; more cuttings per group would make it more reliable.</div>
<h3>Anomalies and means</h3>
<p>An <b>anomaly</b> is a result that doesn’t fit the pattern. Leave it out of the mean (and say why), then repeat that measurement if you can. E.g. trials 20, 22, <b>9</b> → mean = (20 + 22) ÷ 2 = 21 mm.</p>
<p><b>Repeats</b> reduce the effect of random errors and help spot anomalies → more <b>reliable</b>. A <b>valid</b> test changes only one variable and measures what it claims to.</p>
<div class="trap"><b>Exam traps</b><ul><li>“It goes up” without numbers = low level.</li><li>Missing the plateau at the end of a graph.</li><li>Mixing up independent and dependent variables.</li><li>Concluding beyond the range you tested.</li><li>Vague improvements (“do it more accurately”).</li></ul></div>`,
cmd:`
<h3>Command terms (what the question really wants)</h3>
<table><tr><th>Term</th><th>Meaning</th><th>Example answer (about sperm/flowers)</th></tr>
<tr><td><b>State</b></td><td>Specific name, value or brief answer; no explanation</td><td>“State the function of the anther.” → “It makes pollen.”</td></tr>
<tr><td><b>Outline</b></td><td>Brief account or summary</td><td>“Outline the path of sperm.” → “Testes → sperm duct → prostate adds fluid → urethra → penis.”</td></tr>
<tr><td><b>Describe</b></td><td>Detailed account of a situation, event, pattern or process</td><td>Several features, each with what it does and why it helps</td></tr>
<tr><td><b>Apply</b></td><td>Use knowledge in a given (often new) situation</td><td>“A plant on a windy mountain…” → use wind-pollination features</td></tr>
<tr><td><b>Analyse</b></td><td>Break down information to find key parts and relationships; reach conclusions</td><td>Trend + numbers + plateau + explanation + validity</td></tr>
<tr><td><b>Justify</b></td><td>Valid reasons or evidence supporting an answer</td><td>“…because the data shows 42 seeds vs 3 seeds…”</td></tr></table>
<p><b>Other common terms:</b> <b>Explain</b> = give reasons/causes (use “because”). <b>Suggest</b> = propose a sensible answer for a new situation. <b>Compare</b> = similarities AND differences (write “whereas”). <b>Evaluate</b> = strengths and weaknesses / how valid.</p>
<h3>The Criterion A rubric (simplified)</h3>
<table><tr><th>Level</th><th>Strand i (knowledge)</th><th>Strand ii (apply)</th><th>Strand iii (analyse)</th></tr>
<tr><td>1–2</td><td>Recall basics</td><td>Simple solution, familiar</td><td>Simple judgement</td></tr>
<tr><td>3–4</td><td>State: name and define</td><td>Solve familiar problems</td><td>General trends</td></tr>
<tr><td>5–6</td><td>Outline with correct terminology</td><td>Familiar + suggest for unfamiliar</td><td>Trends <b>with numbers</b>, supported conclusions</td></tr>
<tr><td>7–8</td><td><b>Describe in detail</b>, linking structure → function</td><td><b>Fully explain</b> familiar and <b>justify adaptations</b> in unfamiliar situations</td><td>Key features (<b>plateaus</b>), <b>evaluate validity</b>, <b>specific improvements</b></td></tr></table>
<div class="tip"><b>Tips for success tomorrow</b><ul>
<li>Underline the <b>command term</b> and the <b>marks</b>. 4 marks = about 4 separate points.</li>
<li>Use key words exactly (oviduct, implantation, zygote, stigma, ovule…).</li>
<li>Link: feature → what it does → <b>so that / which means</b>…</li>
<li>For data: always quote <b>numbers with units</b> and look for <b>plateaus, peaks and anomalies</b>.</li>
<li>For unfamiliar situations: don’t panic. Find the familiar idea hiding inside (wind vs insect, asexual vs sexual, diffusion…).</li>
<li>Check calculations: dates (day 1 = start), percentages (A = T, C = G).</li>
<li>Don’t leave blanks; a sensible suggestion can earn marks.</li></ul></div>
<div class="model"><b>Big Question (Lesson 11):</b> I can <b>describe</b> structures like the sperm cell and the placenta in detail, <b>apply</b> my knowledge to new situations like a plant on a windy mountain, and <b>analyse</b> data by giving trends with numbers, spotting plateaus and judging whether a conclusion is valid.</div>`

 NOTES.asex=`
<h3>Two ways to make offspring</h3>
<div class="two">
<div class="box blue"><h4>📠 Asexual reproduction</h4><ul><li>Needs <b>1 parent</b></li><li><b>No fusion of gametes</b> (no fertilisation)</li><li>Offspring are <b>genetically identical</b> = <b>clones</b></li></ul></div>
<div class="box pink"><h4>🔀 Sexual reproduction</h4><ul><li>Needs <b>2 parents</b> (male and female)</li><li><b>Fusion of male and female gametes</b> (sperm/pollen + egg)</li><li>Offspring show <b>genetic variation</b> (a mix of genes from both parents)</li></ul></div></div>
<h3>Examples of asexual reproduction</h3>
<table><tr><th>Type</th><th>What happens</th><th>Example</th></tr>
<tr><td><b>Binary fission</b></td><td>One cell splits into two identical cells</td><td>Bacteria</td></tr>
<tr><td><b>Budding</b></td><td>A small new organism grows out of the parent, then breaks off</td><td>Yeast, hydra</td></tr>
<tr><td><b>Runners</b></td><td>A stem grows along the ground and roots into a new plant</td><td>Strawberry plants</td></tr>
<tr><td><b>Tubers</b></td><td>A new plant grows from a swollen underground stem</td><td>Potatoes</td></tr></table>
<p>Sexual examples: humans, ladybirds, flowering plants making seeds. ⚠️ Strawberries (runners + seeds) and starfish can do <b>both</b>.</p>
<h3>Advantages and disadvantages</h3>
<table><tr><th></th><th>👍 Advantages</th><th>👎 Disadvantages</th></tr>
<tr><td><b>Asexual</b></td><td>Fast; many offspring; no mate needed</td><td>No variation: one disease or change could wipe them all out</td></tr>
<tr><td><b>Sexual</b></td><td>Variation, so some may survive change or disease</td><td>Slower; needs a mate; fewer offspring</td></tr></table>
<div class="trap"><b>Exam traps</b><ul><li>Clone = identical <b>genes</b>, not just “looks alike”.</li><li>Identical twins are clones of each other (one zygote split), not of their parents.</li></ul></div>`;
 NOTES.human=`
<h3>♂ Male reproductive system</h3>
<table><tr><th>Part</th><th>Function</th></tr>
<tr><td><b>Testes</b> (testicles)</td><td>Produce <b>sperm cells</b> and the hormone <b>testosterone</b></td></tr>
<tr><td><b>Scrotum</b></td><td>Sac of skin that holds the testes <b>outside</b> the body at a <b>lower temperature</b> for healthy sperm production</td></tr>
<tr><td><b>Epididymis</b></td><td>Coiled tube behind the testes where sperm <b>mature and are stored</b></td></tr>
<tr><td><b>Sperm duct</b> (vas deferens)</td><td>Carries sperm from the epididymis towards the urethra</td></tr>
<tr><td><b>Prostate & seminal vesicles</b></td><td>Make <b>seminal fluid</b> that nourishes sperm and helps them swim. Sperm + seminal fluid = <b>semen</b></td></tr>
<tr><td><b>Urethra</b></td><td>Tube through which semen and urine leave the body (never at the same time)</td></tr>
<tr><td><b>Penis</b></td><td>Deposits semen into the female reproductive tract</td></tr></table>
<p><b>Sperm path:</b> testes → epididymis → sperm duct → (prostate & seminal vesicles add fluid) → urethra → penis.</p>
<div class="fig">${FIGS.male}</div>
<p class="small mute">Key: A bladder · B sperm duct · C prostate gland · D urethra · E penis · F testis · G scrotum · H seminal vesicle · I epididymis</p>
<h3>♀ Female reproductive system</h3>
<table><tr><th>Part</th><th>Function</th></tr>
<tr><td><b>Ovaries</b></td><td>Produce and release <b>eggs (ova)</b> and the hormones <b>estrogen & progesterone</b></td></tr>
<tr><td><b>Oviduct</b> (fallopian tube)</td><td>Connects ovary to uterus. <b>Fertilisation happens here</b></td></tr>
<tr><td><b>Uterus</b> (womb)</td><td>Muscular organ where the fertilised egg <b>implants</b> and the embryo/fetus grows</td></tr>
<tr><td><b>Endometrium</b></td><td>Inner lining of the uterus that <b>thickens every month</b> to prepare for pregnancy</td></tr>
<tr><td><b>Cervix</b></td><td>Narrow entrance / neck at the bottom of the uterus leading to the vagina</td></tr>
<tr><td><b>Vagina</b></td><td>Muscular tube that receives the penis during intercourse; the <b>birth canal</b></td></tr></table>
<p><b>Egg path:</b> ovary → oviduct → uterus → cervix → vagina.</p>
<div class="fig">${FIGS.female}</div>
<p class="small mute">Key: A ovary · B oviduct · C uterus wall · F endometrium · D cervix · E vagina</p>
<h3>Gametes: built for the job</h3>
<table><tr><th></th><th>🏊 Sperm cell</th><th>🥚 Egg cell (ovum)</th></tr>
<tr><td>Size & number</td><td>Tiny; millions released</td><td>Large (biggest human cell); usually 1 a month</td></tr>
<tr><td>Movement</td><td>Swims with its <b>tail</b></td><td>Moved along the oviduct by cilia</td></tr>
<tr><td>Energy</td><td>Many <b>mitochondria</b></td><td>Big <b>food store</b> for the embryo</td></tr>
<tr><td>Special</td><td><b>Acrosome</b> enzymes digest the egg’s outer layer</td><td>Membrane changes after one sperm enters, blocking others</td></tr>
<tr><td>Chromosomes</td><td>23 (haploid)</td><td>23 (haploid)</td></tr></table>
<div class="tip"><b>Level 7–8 trick:</b> feature → what it does → why it helps. “Many <b>mitochondria</b> release energy <b>so that</b> the tail can swim to the egg.”</div>
<div class="trap"><b>Exam traps</b><ul><li>Fertilisation = <b>oviduct</b>; implantation = <b>uterus</b> (endometrium).</li><li>Sperm are <b>made</b> in the testes but <b>mature</b> in the epididymis.</li><li>Ovaries make estrogen & progesterone; testes make testosterone.</li></ul></div>`;
 NOTES.cycle=`
<h3>The 28-day menstrual cycle</h3>
<table><tr><th>Phase</th><th>Days</th><th>What happens</th></tr>
<tr><td><b>Menstruation</b></td><td>1–5</td><td>No egg was fertilised, so the <b>endometrium</b> breaks down and is shed through the vagina</td></tr>
<tr><td><b>Lining prepares</b></td><td>6–13</td><td><b>Estrogen rises</b>; the lining builds back up and thickens with blood vessels</td></tr>
<tr><td><b>Ovulation</b></td><td>14</td><td>A mature egg is released from the ovary into the oviduct (<b>highest fertility</b>)</td></tr>
<tr><td><b>Luteal phase</b></td><td>15–28</td><td><b>Progesterone</b> keeps the lining thick. No fertilisation → hormone levels drop → menstruation again</td></tr></table>
<ul><li>Day 1 = the first day of the period.</li><li>The egg survives ~1 day; sperm up to ~5 days → fertile window ≈ days 9–15.</li><li>Other cycle lengths: ovulation ≈ cycle length − 14.</li></ul>
<div class="widget" id="w-cycle"><b>🧮 Try it: cycle calculator</b><br><br>
<label>Period start</label><input type="date" id="cyStart" value="2026-03-01"> &nbsp; <label>Cycle length</label><input type="number" id="cyLen" value="28" min="21" max="40" style="width:70px"> days
<div id="cyOut" style="margin-top:10px"></div></div>
<h3>Fertilisation & early development: F-Z-E-I</h3>
<ol><li><b>F</b>ertilisation: sperm nucleus and egg nucleus <b>fuse</b> inside the <b>oviduct</b>.</li>
<li><b>Z</b>ygote: the <b>single cell</b> made straight after fusion (46 chromosomes).</li>
<li><b>E</b>mbryo: the zygote divides again and again into a cluster of cells as it travels to the uterus.</li>
<li><b>I</b>mplantation: the embryo attaches to the thick <b>endometrium</b> and grows into a fetus.</li></ol>
<div class="trap"><b>⚠️ Common trap:</b> the <b>zygote comes BEFORE the embryo</b>. Remember <b>F-Z-E-I</b>. And fertilisation is in the oviduct, not the uterus.</div>
<p><b>Twins:</b> identical = one zygote splits (same genes); non-identical = two eggs + two sperm.</p>`;
 NOTES.flower=`
<h3>Flower structure</h3>
<div class="fig">${FIGS.flower}</div>
<p class="small mute">Key: A stigma · B style · C ovary · D ovule · E anther · F filament · G petal · H sepal · I nectary</p>
<div class="two"><div class="box blue"><h4>♂ Stamen (male)</h4><ul><li><b>Anther</b>: produces and releases <b>pollen grains</b> (male gametes)</li><li><b>Filament</b>: thin stalk that holds up the anther</li></ul><p class="small">Memory trick: sta<b>MEN</b> = male.</p></div>
<div class="box pink"><h4>♀ Pistil / Carpel (female)</h4><ul><li><b>Stigma</b>: sticky top that captures pollen</li><li><b>Style</b>: tube connecting stigma to ovary</li><li><b>Ovary</b>: swollen base containing <b>ovules</b> (female gametes / eggs)</li></ul></div></div>
<h3>Supporting parts</h3>
<ul><li><b>Petals</b>: brightly coloured / scented to attract animal pollinators</li><li><b>Sepals</b>: green, leaf-like; protect the unopened bud</li><li><b>Nectary</b>: makes sugary nectar for insects</li></ul>
<p><b>Outside → in:</b> sepals → petals → stamens → carpel (the order you dissect in).</p>
<h3>Insect- vs wind-pollinated</h3>
<table><tr><th></th><th>🐝 Insect</th><th>🌬️ Wind</th></tr>
<tr><td>Petals</td><td>Large, bright, scented, nectar</td><td>Small, green or none, no scent</td></tr>
<tr><td>Anthers & stigma</td><td>Inside; sticky stigma</td><td>Dangling anthers; feathery stigmas outside</td></tr>
<tr><td>Pollen</td><td>Less; sticky or spiky</td><td>Huge amounts; light and smooth</td></tr></table>
<h3>Dissection lab</h3>
<p>Cut on a tile, away from your body, blade pointing down, report cuts, wash hands. Drawing: pencil, no shading, ruled label lines, title.</p>
<div class="trap"><b>Exam traps</b><ul><li>Stamen = anther + filament. Pistil = carpel = stigma + style + ovary.</li><li><b>Ovule → seed</b>, <b>ovary → fruit</b>.</li></ul></div>`;
 NOTES.poll=`
<h3>Pollination vs fertilisation</h3>
<div class="two"><div class="box amber"><h4>🚚 Pollination</h4><p>The transfer of pollen from the <b>anther</b> (male) to the sticky <b>stigma</b> (female). It can happen by <b>wind, insects, birds or water</b>.</p></div>
<div class="box green"><h4>💥 Fertilisation</h4><p>Happens <b>after</b> pollination. A <b>pollen tube</b> grows down through the style into the ovary; the male gamete nucleus travels down it and <b>fuses with the egg nucleus inside the ovule</b>.</p></div></div>
<p><b>Self-pollination:</b> same flower or same plant. <b>Cross-pollination:</b> a different plant of the same species → more variation.</p>
<h3>After fertilisation</h3>
<table><tr><th>Before</th><th>After</th><th>Why</th></tr>
<tr><td><b>Ovule</b></td><td>→ <b>Seed</b></td><td>Contains the plant embryo (and a food store)</td></tr>
<tr><td><b>Ovary</b></td><td>→ <b>Fruit</b></td><td>Swells up and protects the seeds</td></tr></table>
<p>Petals and stamens wither away.</p>
<div class="tip"><b>Order:</b> pollen lands on stigma → pollen tube grows down the style → reaches the ovule → nuclei fuse → ovule becomes a seed, ovary becomes a fruit.</div>
<div class="trap"><b>Exam traps</b><ul><li>Pollination = <i>moving</i> pollen. Fertilisation = nuclei <i>fusing</i>. Pollination always comes first.</li><li>A different flower on the <b>same plant</b> is still self-pollination.</li></ul></div>`;
 NOTES.seeds=`
<p class="mute"><b>Bonus topic:</b> this isn’t on your test content list, but it’s from Lesson 7.</p>
<h3>Seed dispersal</h3>
<table><tr><th>Method</th><th>Adaptation</th><th>Examples</th></tr>
<tr><td>Wind</td><td>Wings or parachutes; light</td><td>Sycamore, dandelion</td></tr>
<tr><td>Animals (eaten)</td><td>Sweet, bright, fleshy fruit; hard seed coat</td><td>Cherry, blackberry</td></tr>
<tr><td>Animals (hooks)</td><td>Hooks catch on fur</td><td>Burdock</td></tr>
<tr><td>Explosive</td><td>Pod dries and bursts</td><td>Pea</td></tr>
<tr><td>Water</td><td>Floats</td><td>Coconut</td></tr></table>
<p><b>Why disperse?</b> Less competition with the parent for light, water, minerals and space; new areas can be colonised.</p>
<h3>Germination</h3><p>Needs <b>W</b>ater, <b>O</b>xygen, <b>W</b>armth (WOW!), not light.</p>
<h3>Life cycles</h3><ul><li>Plant: seed → plant → flower → pollination → fertilisation → seeds → dispersal.</li><li>Ladybird / butterfly: egg → larva → pupa → adult.</li><li>Frog: egg → tadpole → froglet → adult.</li></ul>`;
 NOTES.dna=`
<h3>Key definitions</h3>
<table><tr><th>Term</th><th>Meaning</th></tr>
<tr><td><b>DNA</b> (deoxyribonucleic acid)</td><td>Double-helix molecule carrying the chemical code for life</td></tr>
<tr><td><b>Gene</b></td><td>A section of DNA that codes for a specific trait or protein (e.g. eye colour)</td></tr>
<tr><td><b>Chromosome</b></td><td>Long thread-like structure of DNA <b>tightly coiled around proteins</b></td></tr>
<tr><td><b>Nucleus</b></td><td>Where all the chromosomes are kept in eukaryotic cells (like ours)</td></tr></table>
<h3>Hierarchy: smallest → largest</h3>
<div class="tip" style="font-size:17px;text-align:center"><b>Base pairs → Gene → DNA strand → Chromosome → Nucleus</b></div>
<ul><li><b>Base pairs</b>: the smallest unit, the chemical “letters”</li><li><b>Gene</b>: a section of DNA for one protein / trait</li><li><b>DNA strand</b>: a long double helix made of many genes</li><li><b>Chromosome</b>: tightly coiled DNA wrapped around proteins</li><li><b>Nucleus</b>: holds all 46 chromosomes</li></ul>
<h3>Chromosome numbers</h3>
<table><tr><th>Cell</th><th>Chromosomes</th><th>Name</th></tr>
<tr><td>Body (somatic) cells</td><td><b>46</b> (23 pairs)</td><td><b>Diploid</b> (2n)</td></tr>
<tr><td>Gametes (sperm & egg)</td><td><b>23</b> (unpaired)</td><td><b>Haploid</b> (n)</td></tr></table>
<p><b>Why?</b> Sperm (23) + egg (23) → zygote with the full <b>46</b>.</p>
<h3>Structure of DNA</h3>
<ul><li><b>Double helix</b>: two strands twisted like a spiral ladder.</li><li>Building block = <b>nucleotide</b>: phosphate + sugar (deoxyribose) + base.</li><li>Sides = sugar + phosphate; rungs = <b>base pairs</b>.</li><li><b>A pairs with T, C pairs with G</b> (Apple in the Tree, Car in the Garage).</li></ul>
<div class="widget"><b>🧬 Try it: build the partner strand</b><br><br><label>Strand 1</label><input id="dnaIn" value="ATGCCTAGG" style="width:220px;font-family:monospace;text-transform:uppercase">
<div id="dnaOut" style="margin-top:10px"></div></div>
<p><b>Photo 51:</b> Rosalind Franklin’s X-ray image showed DNA is a helix; Watson & Crick used it for their 1953 model.</p>
<div class="trap"><b>Exam traps</b><ul><li>Gene is SMALLER than a chromosome.</li><li>Gametes = 23 (haploid), body cells = 46 (diploid).</li></ul></div>`;

 TOPIC_TIPS.cycle=["Days 1–5 shed, 6–13 rebuild (estrogen), 14 ovulation, 15–28 progesterone keeps the lining thick.","F-Z-E-I: Fertilisation → Zygote → Embryo → Implantation.","Ovulation ≈ cycle length − 14; the egg lives ~1 day, sperm ~5."];

})();

function chart(c){
 const W=540,H=310,L=62,R=22,T=36,B=c.kind==="bar"?70:58;const pw=W-L-R,ph=H-T-B;const ymax=c.ymax,ticks=c.ticks||5;
 let s=`<svg viewBox="0 0 ${W} ${H}" width="${W}" class="chart"><text x="${W/2}" y="20" text-anchor="middle" class="ct">${c.title}</text>`;
 for(let i=0;i<=ticks;i++){const v=ymax*i/ticks,y=T+ph-ph*i/ticks;s+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" class="gl"/><text x="${L-8}" y="${y+4}" text-anchor="end" class="tk">${fmt(v)}</text>`}
 const Y=v=>T+ph-ph*v/ymax;
 if(c.kind==="bar"){const n=c.x.length,bw=pw/n*0.45;c.x.forEach((lab,i)=>{const cx=L+pw*(i+0.5)/n;const y=Y(c.y[i]);
   s+=`<rect x="${cx-bw/2}" y="${y}" width="${bw}" height="${T+ph-y}" rx="4" fill="${i?"#a78bfa":"#6366f1"}"/><text x="${cx}" y="${y-6}" text-anchor="middle" class="al">${c.y[i]}</text>`;
   lab.split("\n").forEach((ln,k)=>{s+=`<text x="${cx}" y="${T+ph+18+k*14}" text-anchor="middle" class="tk">${ln}</text>`})});}
 else{const xmin=Math.min(...c.x),xmax=Math.max(...c.x);const X=v=>L+pw*(v-xmin)/(xmax-xmin);
   c.x.forEach(v=>{s+=`<line x1="${X(v)}" x2="${X(v)}" y1="${T+ph}" y2="${T+ph+5}" stroke="#94a3b8"/><text x="${X(v)}" y="${T+ph+18}" text-anchor="middle" class="tk">${v}</text>`});
   s+=`<polyline fill="none" stroke="#6366f1" stroke-width="2.5" points="${c.x.map((v,i)=>X(v)+","+Y(c.y[i])).join(" ")}"/>`;
   c.x.forEach((v,i)=>{s+=`<circle cx="${X(v)}" cy="${Y(c.y[i])}" r="4.5" fill="#fff" stroke="#4f46e5" stroke-width="2.5"/>`});
   s+=`<text x="${L+pw/2}" y="${H-12}" text-anchor="middle" class="al">${c.xl}</text>`;}
 s+=`<line x1="${L}" y1="${T}" x2="${L}" y2="${T+ph}" stroke="#334155" stroke-width="1.5"/><line x1="${L}" y1="${T+ph}" x2="${W-R}" y2="${T+ph}" stroke="#334155" stroke-width="1.5"/>`;
 s+=`<text transform="translate(16 ${T+ph/2}) rotate(-90)" text-anchor="middle" class="al">${c.yl}</text></svg>`;return s;
}
function tableHtml(t){return `<table class="dtable"><tr>${t.head.map(h=>`<th>${h}</th>`).join("")}</tr>${t.rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</table>`}
function helix(seq){
 seq=seq.toUpperCase().replace(/[^ATCG]/g,"").slice(0,18);if(!seq.length)return "";
 const comp={A:"T",T:"A",C:"G",G:"C"},col={A:"#ef4444",T:"#f59e0b",C:"#3b82f6",G:"#10b981"};
 const n=seq.length,dx=34,W=n*dx+30,H=210,mid=105,amp=62;
 const y1=t=>mid-amp*Math.cos(t*0.62),y2=t=>mid+amp*Math.cos(t*0.62),X=t=>15+dx/2+t*dx;
 let p1="",p2="";for(let t=-0.4;t<=n-0.6;t+=0.1){p1+=(p1?"L":"M")+X(t).toFixed(1)+" "+y1(t).toFixed(1);p2+=(p2?"L":"M")+X(t).toFixed(1)+" "+y2(t).toFixed(1)}
 let s=`<svg viewBox="0 0 ${W} ${H}" width="${W}">`;
 for(let i=0;i<n;i++){const b=seq[i],c=comp[b],x=X(i);
  s+=`<line x1="${x}" y1="${y1(i)}" x2="${x}" y2="${mid}" stroke="${col[b]}" stroke-width="6"/><line x1="${x}" y1="${mid}" x2="${x}" y2="${y2(i)}" stroke="${col[c]}" stroke-width="6"/>`;
  s+=`<text x="${x}" y="12" text-anchor="middle" font-size="13" font-weight="800" fill="${col[b]}">${b}</text><text x="${x}" y="${H-2}" text-anchor="middle" font-size="13" font-weight="800" fill="${col[c]}">${c}</text>`;}
 s+=`<path d="${p1}" stroke="#475569" stroke-width="4" fill="none"/><path d="${p2}" stroke="#94a3b8" stroke-width="4" fill="none"/></svg>`;return s;
}

function startMock(){

 const want={i:9,ii:11,iii:6};const pick=[];const pool=shuffle(QS.filter(ok));
 const writ=shuffle(QS.filter(q=>q.type==="written"&&ok(q)));const wPick=[];const wNeed={i:1,ii:2,iii:1};
 for(const q of writ){if(wNeed[q.s]>0){wNeed[q.s]--;wPick.push(q)}}
 wPick.forEach(q=>{pick.push(q);want[q.s]--});
 const topicCount={};pick.forEach(q=>topicCount[q.t]=(topicCount[q.t]||0)+1);
 for(const q of pool){if(pick.includes(q))continue;if(q.type==="written")continue;if(want[q.s]>0&&(topicCount[q.t]||0)<(q.s==="iii"?6:4)){pick.push(q);want[q.s]--;topicCount[q.t]=(topicCount[q.t]||0)+1}}

}

 main().innerHTML=`<div class="card"><div class="row" style="justify-content:space-between"><h2 style="margin:0">🃏 Key word flashcards</h2><label class="small"><input type="checkbox" ${FL.rev?"checked":""} onchange="FL.rev=this.checked;viewFlash()"> Harder: show definition, recall the word</label></div>
 <p class="mute small">Card ${FL.i+1} of ${FL.deck.length} · Say the answer out loud BEFORE flipping. (Space = flip, 1 = knew it, 2 = again)</p>
 <div class="flash"><div class="fcard" id="fc" onclick="this.classList.toggle('flip')"><div class="face front" style="${FL.rev?"font-size:19px;font-weight:700":""}">${front}<div class="lsn">tap to flip</div></div><div class="face back"><div style="${FL.rev?"font-size:28px;font-weight:800;color:#3b2fb8":""}">${back}</div><div class="lsn mute">${c[2]}</div></div></div></div>
 <div class="row" style="justify-content:center;margin-top:16px"><button class="btn" onclick="flashAns(false)">🔁 Didn’t know: again</button><button class="btn primary" onclick="flashAns(true)">✓ Knew it</button></div></div>`;
}
function flashAns(k){const c=FL.deck[FL.i];if(k)FL.know++;else FL.again.push(c);FL.i++;viewFlash()}

/* =========================================================
   QUIZ ENGINE
   ========================================================= */
function startSession(qs,mode,title){
 if(!qs.length){notify("No questions here yet. Try another set!");return}
 S.ses={qs,mode,title,i:0,res:[],t0:Date.now(),deadline:mode==="mock"?Date.now()+45*60000:null};
 S.view="quiz";document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("on",b.dataset.v===(mode==="practice"?"practice":mode)));
 clearInterval(S.timerInt);if(mode!=="practice")S.timerInt=setInterval(tick,1000);
 renderQ();
}
function tick(){const el=$("#timer");if(!S.ses)return;
 if(!S.ses.deadline){if(el){const s=Math.floor((Date.now()-S.ses.t0)/1000);el.textContent=`⏱ ${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`}return}
 const ms=S.ses.deadline-Date.now();
 if(ms<=0){clearInterval(S.timerInt);finish();notify("⏰ Time’s up! Here are your results.");return}
 if(el){const m=Math.floor(ms/60000),s=Math.floor(ms/1000)%60;el.textContent=`⏱ ${m}:${String(s).padStart(2,"0")}`;el.classList.toggle("low",ms<5*60000)}}
function quitQuiz(){if(S.ses.mode==="ultimate"){ask("Take a break? Your progress is saved, so you can resume later from the 🏆 Ultimate tab.",finish,"Finish & see results","Save & exit",()=>{S.ses=null;go("ultimate")});return}
 if(S.ses.res.length)ask("Finish now and see results for the questions you answered?",finish,"Finish","Keep going");else ask("Quit this quiz?",()=>{S.ses=null;go("home")},"Quit","Keep going")}

function figHtml(q){let h="";if(q.fig)h+=`<div class="fig">${FIGS[q.fig]}</div>`;if(q.chart)h+=`<div class="fig">${chart(CH[q.chart])}</div>`;if(q.table)h+=tableHtml(TB[q.table]);return h}

function renderQ(){
 const ses=S.ses;if(ses.i>=ses.qs.length)return finish();
 const q=ses.qs[ses.i];const t=TBY[q.t];const test=ses.mode!=="practice";
 // Tip break every 10 questions in the Mock / Ultimate tests
 ses.breaks=ses.breaks||{};
 if(test&&ses.i>0&&ses.i%10===0&&!ses.breaks[ses.i]){ses.breaks[ses.i]=1;
  const tips=TOPIC_TIPS[q.t];const a=tips[Math.floor(Math.random()*tips.length)];let b=tips[(tips.indexOf(a)+1)%tips.length];
  main().innerHTML=`<div class="qtop"><div class="prog"><div style="width:${100*ses.i/ses.qs.length}%"></div></div><span class="small"><b>${ses.i}</b>/${ses.qs.length} done</span></div>
  <div class="card hero" style="text-align:center"><div style="font-size:40px">💡</div><h2>Tip break</h2><p class="mute">${ses.i} questions done, ${ses.qs.length-ses.i} to go. ${BREAK_TIPS[(ses.i/10-1)%BREAK_TIPS.length]}</p>
  <div class="tip" style="text-align:left"><b>Coming up: ${t.ic} ${t.name}. Remember:</b><ul><li>${a}</li>${b!==a?`<li>${b}</li>`:""}</ul></div>
  <button class="btn primary" id="nextBtn">Keep going →</button></div>`;
  $("#nextBtn").onclick=renderQ;$("#nextBtn").focus({preventScroll:true});return}
 ses.cur={q,checked:false,ready:()=>false,hint:false};
 const hint=q.hint||(q.type==="written"?`${CMD_HINT[cmdOf(q)]||CMD_HINT.describe} Aim for ${q.marks.length} separate points.`:"");
 main().innerHTML=`<div class="qtop"><button class="btn ghost" onclick="quitQuiz()" title="Finish">✕</button><div class="prog"><div style="width:${100*ses.i/ses.qs.length}%"></div></div><span class="small"><b>${ses.i+1}</b>/${ses.qs.length}</span>${test?`<span class="timer" id="timer">⏱</span>`:""}</div>
 <div class="card"><div class="chips"><span class="chip">${t.ic} ${t.name}</span><span class="chip s-${q.s}">${STRAND[q.s]}</span><span class="chip ty">${TYPEHINT[q.type]}</span>${q.challenge?`<span class="chip" style="background:#fef9c3;color:#854d0e">⭐ Challenge: goes beyond the lessons</span>`:""}</div>
 <div class="qtext">${q.q}</div>${figHtml(q)}<div id="hintBox"></div><div id="qbody"></div><div id="fb"></div>
 <div class="actions" id="acts"><button class="btn primary" id="checkBtn" disabled>${q.type==="written"?"Submit for marking":"Check answer"}</button>${hint?`<button class="btn" id="hintBtn">💡 Hint${test?" (half marks)":""}</button>`:""}<button class="btn ghost" id="idkBtn">I don’t know: show me</button></div>
 <p class="kbd" style="margin-top:10px">${q.type==="mcq"?"Keys: 1–4 to choose, Enter to check / continue":"Enter to continue after checking"}</p></div>`;
 if(ses.mode!=="practice")tick();
 R[q.type](q,$("#qbody"),ses.cur);
 $("#checkBtn").onclick=()=>doCheck(false);
 if(hint)$("#hintBtn").onclick=()=>{ses.cur.hint=true;$("#hintBtn").remove();$("#hintBox").innerHTML=`<div class="tip" style="margin:0 0 12px">💡 <b>Hint:</b> ${hint}</div>`};
 $("#idkBtn").onclick=()=>{if(ses.mode!=="practice")ask("Skip this question? It will score 0.",()=>doCheck(true),"Skip","Cancel");else doCheck(true)};
}
function enableCheck(){const c=S.ses.cur;const b=$("#checkBtn");if(b)b.disabled=!c.ready()}

function doCheck(skip){
 const ses=S.ses,c=ses.cur,q=c.q;if(c.checked)return;c.checked=true;
 $("#idkBtn").remove();$("#checkBtn").remove();const hb=$("#hintBtn");if(hb)hb.remove();
 if(q.type==="written"&&!skip){c.startMarking(res=>record(res));return}
 const res=skip?c.skipRes():c.grade();
 if(ses.mode==="practice"||skip&&q.type==="written"){c.reveal&&c.reveal()}
 record(res,skip);
}
function record(res,skip){
 const ses=S.ses,q=ses.cur.q,test=ses.mode!=="practice";
 const halved=test&&ses.cur.hint&&!skip&&res.earned>0;if(halved){res.earned=Math.round(res.earned*50)/100;res.mark=(res.mark||"")+" · 💡 hint used: half marks"}
 const frac=res.possible?res.earned/res.possible:0;ses.tipN=(ses.tipN||0)+1;
 ses.res.push({q,earned:res.earned,possible:res.possible,frac,your:res.your||"",correct:res.correct||"",mark:res.mark||""});
 LAST[q.id]=Math.round(frac*100)/100;store.set("last",LAST);saveUltimate();
 const fb=$("#fb");
 if(ses.mode==="practice"||q.type==="written"){
  const cls=frac>=0.999?"good":frac>0?"part":"bad";const head=frac>=0.999?"✓ Correct!":frac>0?`◐ Partly right: ${fmt(res.earned)}/${res.possible}`:skip?"Here’s the answer:":"✗ Not quite";
  if(q.type!=="written")fb.innerHTML=`<div class="fb ${cls}"><div class="head">${head}</div>${frac<0.999&&res.correct?`<div><b>Correct answer:</b> ${res.correct}</div>`:""}${q.ex?`<div class="why"><b>Why:</b> ${q.ex}</div>`:""}</div>`;
  else fb.insertAdjacentHTML("beforeend",`<div class="fb ${cls}"><div class="head">${head}</div>${q.ex?`<div class="why">${q.ex}</div>`:""}</div>`);
 }else{fb.innerHTML=`<div class="fb neutral"><b>Answer saved.</b>${halved?" (Hint used: half marks.)":""} Feedback comes at the end, like the real test.<div class="why">💡 <b>Learning tip:</b> ${tipFor(q,ses.tipN)}</div></div>`}
 if(test&&q.type==="written")fb.insertAdjacentHTML("beforeend",`<div class="fb neutral" style="margin-top:8px">💡 <b>Learning tip:</b> ${TYPE_TIPS.written}${halved?" <i>(Hint used: half marks.)</i>":""}</div>`);
 const acts=$("#acts");acts.innerHTML=`<button class="btn primary" id="nextBtn">${ses.i+1<ses.qs.length?"Next question →":"See results →"}</button>`;
 $("#nextBtn").onclick=()=>{ses.i++;renderQ()};$("#nextBtn").focus({preventScroll:true});
}

/* ---------- renderers ---------- */
const R={
mcq(q,el,c){const ord=shuffle(q.o.map((_,i)=>i));let sel=null;
 el.innerHTML=ord.map((oi,k)=>`<button class="opt" data-i="${oi}"><span class="key">${"ABCDEFG"[k]}</span><span>${q.o[oi]}</span></button>`).join("");
 const btns=[...el.querySelectorAll(".opt")];
 btns.forEach(b=>b.onclick=()=>{if(c.checked)return;btns.forEach(x=>x.classList.remove("sel"));b.classList.add("sel");sel=+b.dataset.i;enableCheck()});
 c.pick=k=>{if(btns[k])btns[k].click()};
 c.ready=()=>sel!==null;
 c.grade=()=>{const ok=sel===q.a;return{earned:ok?1:0,possible:1,your:sel==null?"(skipped)":q.o[sel],correct:q.o[q.a]}};
 c.skipRes=()=>({earned:0,possible:1,your:"(skipped)",correct:q.o[q.a]});
 c.reveal=()=>btns.forEach(b=>{b.classList.add("locked");const i=+b.dataset.i;if(i===q.a)b.classList.add("right");else if(i===sel)b.classList.add("wrong")});
},
multi(q,el,c){const ord=shuffle(q.o.map((_,i)=>i));const sel=new Set();
 el.innerHTML=`<p class="small mute" style="margin-top:-6px">There may be more than two correct answers.</p>`+ord.map((oi,k)=>`<button class="opt" data-i="${oi}"><span class="key">☐</span><span>${q.o[oi]}</span></button>`).join("");
 const btns=[...el.querySelectorAll(".opt")];
 btns.forEach(b=>b.onclick=()=>{if(c.checked)return;const i=+b.dataset.i;if(sel.has(i)){sel.delete(i);b.classList.remove("sel");b.querySelector(".key").textContent="☐"}else{sel.add(i);b.classList.add("sel");b.querySelector(".key").textContent="✓"}enableCheck()});
 c.ready=()=>sel.size>0;
 c.grade=()=>{const A=new Set(q.a);let hit=0,bad=0;sel.forEach(i=>A.has(i)?hit++:bad++);const ok=hit===A.size&&bad===0;
  const earned=ok?1:Math.max(0,(hit-bad)/A.size)*0.5;return{earned:Math.round(earned*100)/100,possible:1,your:[...sel].map(i=>q.o[i]).join("; ")||"(none)",correct:q.a.map(i=>q.o[i]).join("; ")}};
 c.skipRes=()=>({earned:0,possible:1,your:"(skipped)",correct:q.a.map(i=>q.o[i]).join("; ")});
 c.reveal=()=>{const A=new Set(q.a);btns.forEach(b=>{b.classList.add("locked");const i=+b.dataset.i;const k=b.querySelector(".key");
  if(A.has(i)&&sel.has(i)){b.classList.add("right");k.textContent="✓"}else if(A.has(i)){b.classList.add("missed");b.insertAdjacentHTML("beforeend",`<span class="tag" style="color:var(--good)">missed</span>`)}else if(sel.has(i)){b.classList.add("wrong");k.textContent="✗"}})};
},
order(q,el,c){let pool=shuffle(q.items);let tries=0;while(pool.join()===q.items.join()&&tries++<10)pool=shuffle(q.items);let seq=[];
 const draw=()=>{el.innerHTML=`<p class="small mute" style="margin-top:-6px">Tap the cards in the correct order. Tap a placed card to send it back.</p>
  <div class="pool">${pool.length?pool.map((it,k)=>`<button class="pchip" data-k="${k}">${it}</button>`).join(""):"<span class='small mute'>All placed ✓</span>"}</div>
  <div class="seq">${seq.map((it,k)=>`<div class="sitem" data-k="${k}"><span class="n">${k+1}</span><span>${it}</span></div>`).join("")}${pool.map((_,k)=>`<div class="slot">${seq.length+k+1}.</div>`).join("")}</div>`;
  el.querySelectorAll(".pchip").forEach(b=>b.onclick=()=>{if(c.checked)return;seq.push(pool.splice(+b.dataset.k,1)[0]);draw();enableCheck()});
  el.querySelectorAll(".sitem").forEach(b=>b.onclick=()=>{if(c.checked)return;pool.push(seq.splice(+b.dataset.k,1)[0]);draw();enableCheck()})};
 draw();
 c.ready=()=>pool.length===0;
 c.grade=()=>{const right=seq.filter((it,k)=>it===q.items[k]).length;const ok=right===q.items.length;return{earned:ok?1:Math.round(right/q.items.length*50)/100,possible:1,your:seq.join(" → "),correct:q.items.join(" → ")}};
 c.skipRes=()=>({earned:0,possible:1,your:"(skipped)",correct:q.items.join(" → ")});
 c.reveal=()=>{if(!seq.length){seq=[...q.items];pool=[];draw()}el.querySelectorAll(".sitem").forEach((b,k)=>{b.classList.add(seq[k]===q.items[k]?"right":"wrong");b.style.cursor="default"})};
},
match(q,el,c){const opts=shuffle([...new Set(q.pairs.map(p=>p[1]).concat(q.extra||[]))]);const rows=shuffle(q.pairs.map((p,i)=>i));if(q.fig)rows.sort((a,b)=>q.pairs[a][0].localeCompare(q.pairs[b][0]));
 el.innerHTML=rows.map(i=>`<div class="mrow" data-i="${i}"><div class="ml">${q.pairs[i][0]}</div><select><option value="">Choose…</option>${opts.map(o=>`<option>${esc(o)}</option>`).join("")}</select></div>`).join("");
 const sels=[...el.querySelectorAll("select")];sels.forEach(s=>s.onchange=enableCheck);
 c.ready=()=>sels.every(s=>s.value);
 c.grade=()=>{let right=0;el.querySelectorAll(".mrow").forEach(r=>{if(r.querySelector("select").value===q.pairs[+r.dataset.i][1])right++});const n=q.pairs.length;
  return{earned:right===n?1:Math.round(right/n*80)/100,possible:1,your:`${right}/${n} matched correctly`,correct:q.pairs.map(p=>`${p[0]} → ${p[1]}`).join("<br>")}};
 c.skipRes=()=>({earned:0,possible:1,your:"(skipped)",correct:q.pairs.map(p=>`${p[0]} → ${p[1]}`).join("<br>")});
 c.reveal=()=>el.querySelectorAll(".mrow").forEach(r=>{const s=r.querySelector("select");const ans=q.pairs[+r.dataset.i][1];s.disabled=true;
  if(s.value===ans)r.classList.add("right");else{r.classList.add("wrong");r.insertAdjacentHTML("beforeend",`<div class="fix">✓ ${esc(ans)}</div>`)}});
},
input(q,el,c){el.innerHTML=`<input class="txt" id="ans" placeholder="${q.ph||"Type your answer"}" autocomplete="off">`;const inp=$("#ans");
 inp.oninput=enableCheck;inp.onkeydown=e=>{if(e.key==="Enter"&&c.ready()&&!c.checked){e.preventDefault();e.stopPropagation();doCheck(false)}};setTimeout(()=>inp.focus({preventScroll:true}),50);
 c.ready=()=>inp.value.trim().length>0;
 c.grade=()=>{const raw=inp.value;let ok;if(q.norm==="dna"){ok=raw.toUpperCase().replace(/[^A-Z]/g,"")===q.ans}else{const v=raw.toLowerCase().trim().replace(/[,]/g,"").replace(/\s+/g," ").replace(/\.$/,"");ok=q.accept.some(r=>new RegExp(r,"i").test(v))}
  return{earned:ok?1:0,possible:1,your:raw,correct:q.ans}};
 c.skipRes=()=>({earned:0,possible:1,your:"(skipped)",correct:q.ans});
 c.reveal=()=>{inp.disabled=true;const g=c.grade();inp.classList.add(g.earned?"right":"wrong")};
},
written(q,el,c){el.innerHTML=`<textarea id="wa" rows="7" placeholder="Write your full answer here, as you would in the test. Use key words and link ideas with ‘because’, ‘which means’, ‘so that’…"></textarea><div class="small mute" id="wc">0 words · aim for about ${q.marks.length*15}+ words for ${q.marks.length} marks</div>`;
 const ta=$("#wa");ta.oninput=()=>{$("#wc").textContent=(ta.value.trim().split(/\s+/).filter(Boolean).length)+` words · aim for about ${q.marks.length*15}+ words for ${q.marks.length} marks`;enableCheck()};
 c.ready=()=>ta.value.trim().length>0;
 c.skipRes=()=>({earned:0,possible:q.marks.length,your:"(skipped)",correct:q.model});
 c.reveal=()=>{ta.disabled=true;$("#fb").innerHTML=`<div class="model"><b>Model answer:</b> ${q.model}</div>`};
 c.startMarking=done=>{ta.disabled=true;markWritten(q,ta.value,done)};
}
};

 if(document.querySelector(".modal"))return;
 if(S.view==="flash"&&FL){if(e.code==="Space"){e.preventDefault();const f=$("#fc");f&&f.classList.toggle("flip")}else if(e.key==="1")flashAns(true);else if(e.key==="2")flashAns(false);return}

 if(c.q.type==="mcq"&&!c.checked&&tag!=="input"&&tag!=="textarea"){const k="1234567".indexOf(e.key);const k2="abcdefg".indexOf(e.key.toLowerCase());if(k>=0)c.pick(k);else if(k2>=0&&e.key.length===1)c.pick(k2)}

/* ---------------- RESULTS ---------------- */
function levelFor(p){if(p<8)return 0;if(p<20)return 1;if(p<32)return 2;if(p<44)return 3;if(p<55)return 4;if(p<66)return 5;if(p<77)return 6;if(p<88)return 7;return 8}
function finish(){
 clearInterval(S.timerInt);const ses=S.ses;if(!ses)return go("home");
 const res=ses.res;
 // in mock, unanswered count as 0
 const test=ses.mode!=="practice";if(ses.mode==="ultimate")store.set("ult",null);
 if(test){for(let k=res.length;k<ses.qs.length;k++){const q=ses.qs[k];res.push({q,earned:0,possible:q.type==="written"?q.marks.length:1,frac:0,your:"(not answered)",correct:q.type==="written"?q.model:""})}}
 const weight=r=>r.q.type==="written"?3:1; // written answers weigh more
 const sum=(arr,f)=>arr.reduce((a,r)=>a+f(r),0);
 const pct=arr=>arr.length?Math.round(100*sum(arr,r=>r.frac*weight(r))/sum(arr,weight)):null;
 const tot=pct(res);const byS=["i","ii","iii"].map(s=>({s,p:pct(res.filter(r=>r.q.s===s)),n:res.filter(r=>r.q.s===s).length}));
 const byT=TOPICS.map(t=>({t,p:pct(res.filter(r=>r.q.t===t.id)),n:res.filter(r=>r.q.t===t.id).length})).filter(x=>x.n);
 const wrong=res.filter(r=>r.frac<0.999);
 const lv=levelFor(tot);
 const desc={0:"Not yet at level 1",1:"Recalls basic knowledge",2:"Recalls basic knowledge",3:"States knowledge; solves familiar problems",4:"States knowledge; solves familiar problems",5:"Outlines with correct terms; suggests solutions for unfamiliar problems",6:"Outlines with correct terms; suggests solutions for unfamiliar problems",7:"Describes in detail; applies to unfamiliar situations; analyses data thoroughly",8:"Describes in detail; applies to unfamiliar situations; analyses data thoroughly"};
 const weakest=byT.filter(x=>x.p!==null).sort((a,b)=>a.p-b.p).slice(0,2);
 main().innerHTML=`<div class="card hero" style="text-align:center"><h2>${ses.title}: results</h2><div class="big">${tot}%</div>
 ${test?`<p style="margin:12px 0 4px">Estimated Criterion A level: <span class="lvl">${lv} / 8</span></p><p class="small mute">${desc[lv]}. (Just an estimate: your teacher marks the real test with the rubric. Written answers count 3× here, because they matter most for 7–8.)</p>`:`<p class="mute">${tot>=85?"Excellent! You’ve nearly mastered this. 🏆":tot>=65?"Good work! Review the explanations below and go again.":"Keep going: read the notes for your weakest topics, then retry. Mistakes now = marks tomorrow."}</p>`}
 <div class="row" style="justify-content:center;margin-top:10px">${wrong.length?`<button class="btn primary" onclick="startSession(shuffle(S.lastWrong),'practice','Retry this session’s mistakes')">Retry the ${wrong.length} I got wrong</button>`:""}<button class="btn" onclick="S.ses=null;go('home')">Home</button></div></div>
 <div class="card"><h2>By strand</h2>${byS.map(x=>x.n?`<div style="margin-bottom:10px"><b>${STRAND[x.s]}</b> <span class="mute small">(${x.n} q)</span>${test?` · ≈ level <b>${levelFor(x.p)}</b>`:""}<div class="bar"><div style="width:${x.p}%"></div></div><span class="small">${x.p}%</span></div>`:"").join("")}
 ${byT.length>1?`<h2 style="margin-top:20px">By topic</h2><div class="grid">${byT.map(x=>`<div class="tile" style="cursor:default"><div class="tn">${x.t.ic} ${x.t.name}</div><div class="small mute">${x.n} questions</div><div class="bar"><div style="width:${x.p}%"></div></div><div class="small" style="margin-top:4px">${x.p}%</div></div>`).join("")}</div>`:""}
 ${weakest.length&&weakest[0].p<80?`<div class="tip"><b>Study next:</b> ${weakest.map(w=>`<a href="#" onclick="S.ses=null;startLesson('${w.t.id}');return false">${w.t.name} (${w.p}%)</a>`).join(" and ")}</div>`:""}</div>
 <div class="card"><h2>Review every question</h2>${res.map((r,k)=>{const col=r.frac>=0.999?"#22a35a":r.frac>0?"#e3a008":"#e05252";

const PENT=[0,2,4,7,9];
function phrase(bars,prog,lo,hi,density){
 const scale=[];for(let m=lo;m<=hi;m++)if(PENT.includes(m%12))scale.push(m);
 let idx=Math.floor(scale.length/2);const res=[];
 for(let b=0;b<bars;b++){const ch=prog[b%prog.length],pcs=ch.n.map(x=>x%12),ev=[];
  const snap=()=>{let m=scale[idx],best=m,bd=99;for(const c of scale)if(pcs.includes(c%12)&&Math.abs(c-m)<bd){bd=Math.abs(c-m);best=c}idx=scale.indexOf(best);return best};
  if(b===bars-1){ev.push([0,snap()])}
  else for(let s=0;s<8;s++){if(s===0||(Math.random()<density&&(s%2===0||Math.random()<0.45))){idx=Math.max(0,Math.min(scale.length-1,idx+[-2,-1,-1,0,1,1,2][Math.floor(Math.random()*7)]));ev.push([s,s%4===0?snap():scale[idx]])}}
  ev.forEach((e,i)=>e.push((i+1<ev.length?ev[i+1][0]:8)-e[0]));res.push(ev)}
 return res}

function sndPlay(kind){
 if(kind!=="off"&&!sndInit())return;
 if(SND.ctx)sndStop();SND.cur=kind;updSndUI();if(kind==="off")return;
 const tr=TRACKS[kind],ctx=SND.ctx;SND.V=newVoice(tr.rev);
 const e=60/tr.bpm/2,st={};const compose=()=>{const [lo,hi,d]=tr.mel;st.mel={A:phrase(4,tr.prog.A,lo,hi,d),B:phrase(4,tr.prog.B,lo,hi,d)}};compose();
 SND.step=0;SND.next=ctx.currentTime+0.15;const my=SND.V;
 SND.timer=setInterval(()=>{if(SND.V!==my)return;while(SND.next<ctx.currentTime+1.2){const s=SND.step;
   if(s>0&&s%128===0)compose(); // new melodies every 16 bars
   tr.play(s,SND.next,e,st);SND.next+=tr.swing?e*(s%2===0?1+tr.swing:1-tr.swing):e;SND.step++}},120);
}

  card.textContent=items[k][0];card.className="scard sin";left.textContent=`${items.length-k} left · use ← → keys`;busy=false};

(function(){
 const h=s=>{let x=5381;for(const ch of s)x=((x<<5)+x+ch.charCodeAt(0))>>>0;return x};
 const KEY=2088326639; // hash of the password
 if(store.get("unlocked",false)===KEY)return;
 const d=document.createElement("div");d.id="lockScreen";
 d.innerHTML=`<div class="lockbox"><div style="font-size:48px">🔒</div><h2 style="margin:6px 0 4px">Reproduction Mastery</h2><p class="mute" style="margin:0 0 16px">Enter the password to start studying.</p>
 <input id="pw" class="txt" type="password" inputmode="numeric" autocomplete="off" placeholder="Password" style="text-align:center;font-size:22px;letter-spacing:6px">
 <div id="pwMsg" class="small" style="min-height:20px;margin-top:8px;color:var(--bad)"></div>
 <button class="btn primary bigbtn" id="pwGo" style="width:100%">Unlock</button></div>`;
 document.body.appendChild(d);const inp=d.querySelector("#pw");setTimeout(()=>inp.focus(),50);
 const tryIt=()=>{if(h(inp.value.trim())===KEY){store.set("unlocked",KEY);d.classList.add("unlock");setTimeout(()=>d.remove(),450)}else{inp.value="";d.querySelector("#pwMsg").textContent="Wrong password. Try again.";const b=d.querySelector(".lockbox");b.classList.remove("shake");void b.offsetWidth;b.classList.add("shake")}};
 d.querySelector("#pwGo").onclick=tryIt;inp.onkeydown=e=>{if(e.key==="Enter")tryIt()};
})();

go("home");
