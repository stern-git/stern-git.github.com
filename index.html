<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reproduction Mastery · Criterion A Prep</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#1c2333;--mute:#5f6b80;--line:#e2e7f0;--accent:#4f46e5;--accent2:#7c3aed;--soft:#eef0ff;
--good:#15803d;--goodbg:#e7f7ec;--bad:#c62828;--badbg:#fdeceb;--warn:#a15c07;--warnbg:#fff5e0;--r:14px}
*{box-sizing:border-box}
body{overflow-x:hidden;margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;font-size:16px}
header{background:linear-gradient(120deg,#312e81,#6d28d9);color:#fff;position:sticky;top:0;z-index:10;box-shadow:0 2px 10px rgba(0,0,0,.15)}
.hwrap{max-width:980px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{font-weight:800;letter-spacing:.2px;font-size:18px;cursor:pointer;white-space:nowrap}
.logo small{font-weight:500;opacity:.8;margin-left:6px;font-size:12px}
nav{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
nav button{background:transparent;border:0;color:#e9e7ff;padding:7px 11px;border-radius:9px;font-size:14px;cursor:pointer;font-weight:600}
nav button:hover{background:rgba(255,255,255,.12)}
nav button.on{background:#fff;color:#3b2fb8}
main{max-width:980px;margin:0 auto;padding:22px 16px 80px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;margin-bottom:16px;box-shadow:0 1px 3px rgba(20,30,60,.04)}
h1{font-size:28px;margin:0 0 6px}h2{font-size:22px;margin:0 0 12px}h3{font-size:18px;margin:22px 0 8px;color:#2d2a7a}h4{margin:0 0 6px;font-size:16px}
.mute{color:var(--mute)}.small{font-size:13px}
.btn{border:1px solid var(--line);background:#fff;color:var(--ink);padding:10px 16px;border-radius:10px;font-size:15px;font-weight:650;cursor:pointer;transition:.12s}
.btn:hover{border-color:#b9bfe0;transform:translateY(-1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:#4338ca}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.hero{background:linear-gradient(135deg,#eef0ff,#f6edff);border:1px solid #dcd7fb}
.tile{border:1px solid var(--line);border-radius:12px;padding:14px;background:#fff;cursor:pointer;transition:.12s}
.tile:hover{border-color:#a5a0f0;box-shadow:0 4px 14px rgba(79,70,229,.10)}
.tile .tn{font-weight:700}
.bar{height:8px;background:#e8ebf3;border-radius:6px;overflow:hidden;margin-top:8px}
.bar>div{height:100%;background:linear-gradient(90deg,#6366f1,#a855f7);border-radius:6px;transition:width .4s}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{font-size:12px;font-weight:700;padding:3px 9px;border-radius:20px;background:var(--soft);color:#3f37c9}
.chip.s-i{background:#e0f2fe;color:#075985}.chip.s-ii{background:#fef3c7;color:#92400e}.chip.s-iii{background:#fce7f3;color:#9d174d}
.chip.ty{background:#f1f5f9;color:#475569}
.qtop{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.prog{flex:1;height:10px;background:#e3e6f0;border-radius:6px;overflow:hidden}
.prog>div{height:100%;background:linear-gradient(90deg,#6366f1,#a855f7)}
.timer{font-variant-numeric:tabular-nums;font-weight:700;background:#fff;border:1px solid var(--line);padding:4px 10px;border-radius:8px}
.timer.low{color:var(--bad);border-color:#f3b4b4}
.qtext{font-size:18px;font-weight:600;margin:4px 0 14px}
.mk{font-weight:500;color:var(--mute);font-size:14px;white-space:nowrap}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:#fff;border:2px solid var(--line);padding:12px 14px;border-radius:12px;margin-bottom:9px;font-size:15.5px;cursor:pointer;color:var(--ink);line-height:1.4}
.opt:hover{border-color:#b7b3f3}
.opt .key{flex:0 0 26px;height:26px;border-radius:7px;background:#f0f1f8;display:grid;place-items:center;font-weight:800;font-size:13px;color:#4b4f6b}
.opt.sel{border-color:var(--accent);background:#f5f4ff}.opt.sel .key{background:var(--accent);color:#fff}
.opt.right{border-color:#38a169;background:var(--goodbg)}.opt.right .key{background:#38a169;color:#fff}
.opt.wrong{border-color:#e05252;background:var(--badbg)}.opt.wrong .key{background:#e05252;color:#fff}
.opt.missed{border-style:dashed;border-color:#38a169}
.opt .tag{margin-left:auto;font-size:12px;font-weight:800;white-space:nowrap}
.opt.locked{cursor:default}
.pool,.seq{display:flex;flex-direction:column;gap:7px}
.pool{flex-direction:row;flex-wrap:wrap;padding:12px;border:2px dashed #cfd5e5;border-radius:12px;min-height:56px;margin-bottom:12px;background:#fafbff}
.pchip{background:#fff;border:2px solid #d5d9ea;padding:8px 12px;border-radius:10px;cursor:pointer;font-size:15px}
.pchip:hover{border-color:var(--accent)}
.sitem{display:flex;gap:10px;align-items:center;background:#f5f4ff;border:2px solid #c9c4fb;padding:9px 12px;border-radius:10px;cursor:pointer}
.sitem .n{width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px;flex:0 0 26px}
.sitem.right{background:var(--goodbg);border-color:#38a169}.sitem.right .n{background:#38a169}
.sitem.wrong{background:var(--badbg);border-color:#e05252}.sitem.wrong .n{background:#e05252}
.slot{border:2px dashed #d8dcea;border-radius:10px;padding:9px 12px;color:#9aa3b8}
.mrow{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid #eef0f6;flex-wrap:wrap}
.mrow .ml{flex:1 1 200px;font-weight:600}
.mrow select{flex:1 1 260px;padding:9px;border-radius:9px;border:2px solid var(--line);font-size:15px;background:#fff;max-width:100%}
.mrow.right select{border-color:#38a169;background:var(--goodbg)}.mrow.wrong select{border-color:#e05252;background:var(--badbg)}
.mrow .fix{flex-basis:100%;font-size:13.5px;color:var(--good);font-weight:600}
input.txt,textarea{width:100%;padding:12px;border:2px solid var(--line);border-radius:10px;font-size:16px;font-family:inherit}
input.txt:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent)}
input.txt.right{border-color:#38a169;background:var(--goodbg)}input.txt.wrong{border-color:#e05252;background:var(--badbg)}
.fb{margin-top:14px;border-radius:12px;padding:14px 16px;border:1px solid}
.fb.good{background:var(--goodbg);border-color:#a7dcb8}.fb.bad{background:var(--badbg);border-color:#f2b8b5}.fb.part{background:var(--warnbg);border-color:#f3d39a}.fb.neutral{background:#f1f5f9;border-color:#d8e0ea}
.fb .head{font-weight:800;font-size:17px;margin-bottom:4px}
.fb.good .head{color:var(--good)}.fb.bad .head{color:var(--bad)}.fb.part .head{color:var(--warn)}
.why{margin-top:8px}
.actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.check{display:flex;gap:10px;align-items:flex-start;padding:9px 10px;border:1px solid var(--line);border-radius:10px;margin-bottom:7px;cursor:pointer;background:#fff}
.check input{width:20px;height:20px;margin-top:2px;flex:0 0 20px}
.check.auto{border-color:#a7dcb8;background:#f4fbf6}
.model{background:#f6f4ff;border-left:4px solid var(--accent2);padding:12px 14px;border-radius:8px;margin-top:10px}
.trap{background:#fff4f2;border-left:4px solid #e05252;padding:12px 14px;border-radius:8px;margin:14px 0}
.tip{background:#eefbf3;border-left:4px solid #22a35a;padding:12px 14px;border-radius:8px;margin:14px 0}
.trap ul,.tip ul{margin:6px 0 0;padding-left:20px}
table{border-collapse:collapse;width:100%;margin:8px 0 14px;font-size:15px;background:#fff}
th,td{border:1px solid #e1e5ee;padding:8px 10px;text-align:left;vertical-align:top}
th{background:#f3f4fb;font-size:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:640px){.two{grid-template-columns:1fr}.qtext{font-size:17px}h1{font-size:23px}}
.box{border-radius:12px;padding:12px 14px;border:1px solid}
.box.blue{background:#eff6ff;border-color:#bfdbfe}.box.pink{background:#fdf2f8;border-color:#fbcfe8}.box.green{background:#f0fdf4;border-color:#bbf7d0}.box.amber{background:#fffbeb;border-color:#fde68a}
.box ul{margin:4px 0 0;padding-left:20px}
.fig{margin:6px 0 14px;text-align:center}
.fig svg{max-width:100%;height:auto;background:#fff;border:1px solid var(--line);border-radius:12px}
.chart text.ct{font-size:13px;font-weight:700;fill:#24304a}
.chart text.tk{font-size:11px;fill:#5f6b80}
.chart text.al{font-size:12px;fill:#334155;font-weight:600}
.chart .gl{stroke:#eceff5}
.dtable{max-width:520px;margin:0 auto 14px}
.dtable td,.dtable th{text-align:center}
.topics{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.topics button{border:1px solid var(--line);background:#fff;padding:7px 12px;border-radius:20px;cursor:pointer;font-size:13.5px;font-weight:600;color:#3b3f5c}
.topics button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.note p{margin:6px 0 10px}
.note ul{padding-left:22px}
.flash{perspective:1200px;max-width:560px;margin:10px auto}
.fcard{height:270px;position:relative;transform-style:preserve-3d;transition:transform .5s;cursor:pointer}
.fcard.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:26px;text-align:center;border:1px solid var(--line);box-shadow:0 8px 24px rgba(40,40,90,.10)}
.face.front{background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;font-size:28px;font-weight:800}
.face.back{background:#fff;transform:rotateY(180deg);font-size:18px}
.face .lsn{font-size:12px;opacity:.8;margin-top:12px;font-weight:600}
.big{font-size:44px;font-weight:900;line-height:1}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;text-align:center}
.stat .v{font-size:26px;font-weight:800}
details{border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:8px;background:#fff}
details summary{cursor:pointer;font-weight:600}
details[open] summary{margin-bottom:8px}
.okdot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px}
.kbd{font-size:12px;color:var(--mute)}
.widget{border:2px solid #dcd7fb;background:#fbfaff;border-radius:12px;padding:14px;margin:12px 0}
.widget label{font-weight:600;font-size:14px;margin-right:6px}
.widget input{padding:7px;border:1px solid #cfd3e3;border-radius:8px;font-size:15px}
.strip{display:flex;flex-wrap:wrap;gap:3px;margin-top:10px}
.strip div{width:26px;height:34px;border-radius:5px;font-size:11px;display:grid;place-items:center;font-weight:700;color:#334}
.legend span{display:inline-flex;align-items:center;gap:5px;margin-right:12px;font-size:13px}
.legend i{width:14px;height:14px;border-radius:3px;display:inline-block}
.check.hit{border-color:#a7dcb8;background:#f4fbf6}.check.miss{border-color:#f2c4c1;background:#fff8f7}
.check .ico{flex:0 0 22px;font-weight:900}.check.hit .ico::before{content:"✓";color:var(--good)}.check.miss .ico::before{content:"✗";color:var(--bad)}
.score{font-size:26px;font-weight:900;color:#3b2fb8}
.spin{display:inline-block;width:16px;height:16px;border:3px solid #c7c3f7;border-top-color:var(--accent);border-radius:50%;animation:sp 0.8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
.snd{position:fixed;right:18px;bottom:18px;z-index:40;display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.sndbtn{width:54px;height:54px;border-radius:50%;border:0;background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;font-size:24px;cursor:pointer;box-shadow:0 6px 18px rgba(79,70,229,.35)}
.sndbtn.on{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(124,58,237,.45)}50%{box-shadow:0 0 0 12px rgba(124,58,237,0)}}
.pombtn{height:54px;min-width:54px;padding:0 14px;border-radius:27px;border:0;background:linear-gradient(135deg,#ef4444,#f97316);color:#fff;font-size:22px;cursor:pointer;box-shadow:0 6px 18px rgba(239,68,68,.32);display:flex;align-items:center;gap:6px;font-weight:800}
.pombtn span{font-size:15px;font-variant-numeric:tabular-nums}
.pmode{text-align:center;font-weight:800;margin-top:8px;color:#c2410c}.pmode.brk{color:#15803d}
.ptime{text-align:center;font-size:44px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1.1;margin:2px 0 4px}
.pdots{text-align:center;margin-bottom:10px;font-size:14px;letter-spacing:3px}
.psets{margin-top:10px;text-align:center}.psets input{width:44px;padding:3px;border:1px solid #cfd3e3;border-radius:6px}
.ytbox{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
.sndp{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;width:250px;box-shadow:0 10px 30px rgba(20,30,60,.18)}
.sndopts{display:flex;flex-direction:column;gap:6px}
.sndopts button{text-align:left;border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 10px;cursor:pointer;font-size:14px;font-weight:600}
.sndopts button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
/* ---- learn mode ---- */
.xpbox{background:#fff;border:1px solid #dcd7fb;border-radius:12px;padding:8px 14px;font-weight:800;text-align:center;color:#3b2fb8;white-space:nowrap}
.xpbox span{font-size:13px;color:#a15c07}
.path{display:flex;flex-direction:column;gap:10px;position:relative}
.pnode{display:flex;gap:14px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 14px;animation:fadeUp .45s cubic-bezier(.2,.8,.3,1.1) both;flex-wrap:wrap}
.pnode.done{border-color:#bbf7d0;background:#fbfefb}.pnode.bonus{opacity:.82}
.pic{width:52px;height:52px;border-radius:14px;background:linear-gradient(135deg,#eef0ff,#f6edff);display:grid;place-items:center;font-size:28px;flex:0 0 52px}
.pinfo{flex:1 1 220px}.pbtns{display:flex;gap:6px}
.stars{color:#f59e0b;font-size:18px;letter-spacing:2px}.stars span{color:#e2e8f0}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.slide{animation:slideIn .42s cubic-bezier(.2,.9,.3,1.12) both;text-align:left}
@keyframes slideIn{from{opacity:0;transform:translateX(46px)}to{opacity:1;transform:none}}
.semoji{font-size:64px;text-align:center;line-height:1.1;margin-top:4px;animation:popIn .55s cubic-bezier(.3,1.6,.5,1) .08s both}
@keyframes popIn{0%{transform:scale(.3) rotate(-8deg);opacity:0}100%{transform:none;opacity:1}}
.stitle{text-align:center;margin:8px 0 10px;font-size:25px}
.stext{font-size:18px;line-height:1.65;max-width:620px;margin:0 auto;text-align:center}
.analogy{max-width:600px;margin:16px auto 4px;background:#fff8e6;border:1px dashed #f3c76b;border-radius:12px;padding:12px 14px;font-size:16px;animation:fadeUp .5s ease .35s both}
.tagline{text-align:center;font-weight:900;color:var(--accent2);letter-spacing:.5px;margin:4px 0 8px}
.bigbtn{padding:13px 26px;font-size:17px;border-radius:12px}
.lprog{height:14px}.lprog>div{transition:width .45s cubic-bezier(.3,1.2,.5,1)}
.combo{font-weight:900;color:#ea580c;min-width:46px;text-align:right;display:inline-block}
.cpop{animation:cpop .4s cubic-bezier(.3,1.8,.5,1)}@keyframes cpop{0%{transform:scale(.6)}100%{transform:scale(1)}}
#lopts{max-width:620px;margin:0 auto}
.opt.right{animation:bump .4s cubic-bezier(.3,1.6,.5,1)}@keyframes bump{0%{transform:scale(1)}45%{transform:scale(1.035)}100%{transform:scale(1)}}
.shake{animation:shake .42s}@keyframes shake{15%,85%{transform:translateX(-3px)}30%,70%{transform:translateX(6px)}45%,55%{transform:translateX(-8px)}50%{transform:translateX(8px)}}
.lpop{animation:fadeUp .3s ease both;max-width:620px;margin-left:auto;margin-right:auto}
.xpfloat{position:fixed;z-index:60;font-weight:900;color:#7c3aed;pointer-events:none;animation:floatUp 1.05s cubic-bezier(.2,.8,.3,1) forwards;font-size:17px;text-shadow:0 1px 0 #fff}
@keyframes floatUp{0%{opacity:0;transform:translateY(4px) scale(.7)}20%{opacity:1;transform:translateY(-12px) scale(1.12)}35%{transform:translateY(-18px) scale(1)}100%{opacity:0;transform:translateY(-58px)}}
.sortarea{display:grid;grid-template-columns:1fr minmax(150px,1.1fr) 1fr;gap:10px;align-items:stretch;margin:6px 0}
.bucket{border:2px dashed #cfd5e5;border-radius:14px;padding:8px;min-height:150px;background:#fafbff;transition:transform .2s}
.bucket .bh{font-weight:900;text-align:center;margin-bottom:6px}
.bucket .bitem{font-size:12.5px;background:#fff;border:1px solid #e2e8f0;border-radius:8px;padding:3px 7px;margin:3px 0;animation:fadeUp .25s ease both}
.bucket .bitem.was{border-color:#f2c4c1;color:#9f1239}
.bpulse{transform:scale(1.04)}
.scardwrap{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.scard{background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;font-weight:800;font-size:18px;border-radius:14px;padding:18px 16px;text-align:center;box-shadow:0 8px 20px rgba(79,70,229,.3);min-width:140px}
.scard.sin{animation:popIn .35s cubic-bezier(.3,1.6,.5,1) both}
.scard.flyL{transition:transform .32s cubic-bezier(.5,0,.8,.3),opacity .32s;transform:translateX(-170px) scale(.45) rotate(-14deg);opacity:0}
.scard.flyR{transition:transform .32s cubic-bezier(.5,0,.8,.3),opacity .32s;transform:translateX(170px) scale(.45) rotate(14deg);opacity:0}
.sortbtn{font-size:16px;padding:12px 18px}
@media(max-width:640px){.sortarea{grid-template-columns:1fr 1fr}.scardwrap{grid-column:1/3;grid-row:1}.stext{font-size:16.5px}}
.bigstars{font-size:58px;letter-spacing:6px}
.bigstar{display:inline-block;color:#e2e8f0;animation:starPop .55s cubic-bezier(.3,1.8,.5,1) both}
.bigstar.on{color:#f59e0b;text-shadow:0 4px 14px rgba(245,158,11,.45)}
@keyframes starPop{0%{transform:scale(0) rotate(-40deg);opacity:0}70%{transform:scale(1.2) rotate(6deg);opacity:1}100%{transform:none}}
.cf{position:fixed;top:-14px;width:8px;height:14px;z-index:70;pointer-events:none;animation:cfall linear forwards;border-radius:2px}
@keyframes cfall{to{top:104vh;transform:rotate(720deg) translateX(40px)}}
/* ---- password screen ---- */
#lockScreen{position:fixed;inset:0;z-index:100;background:linear-gradient(135deg,#312e81,#6d28d9);display:grid;place-items:center;padding:16px;transition:opacity .4s}
#lockScreen.unlock{opacity:0}
.lockbox{background:#fff;border-radius:18px;padding:28px 26px;width:100%;max-width:340px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.modal{position:fixed;inset:0;background:rgba(20,24,40,.45);display:grid;place-items:center;z-index:50;padding:16px}
.mbox{background:#fff;border-radius:14px;padding:20px 22px;max-width:420px;width:100%;box-shadow:0 12px 40px rgba(0,0,0,.25);font-size:16px}
.mbox p{margin:0 0 16px}
.lvl{display:inline-block;padding:6px 14px;border-radius:10px;background:linear-gradient(120deg,#4f46e5,#a855f7);color:#fff;font-weight:800;font-size:20px}
</style>
</head>
<body>
<header><div class="hwrap">
  <div class="logo" onclick="go('home')">🧬 Reproduction Mastery<small>MYP Y3 · Criterion A</small></div>
  <nav id="nav">
    <button data-v="home">Home</button>
    <button data-v="learn">Learn</button>
    <button data-v="practice">Practice</button>
    <button data-v="mock">Mock Test</button>
    <button data-v="ultimate">🏆 Ultimate</button>
    <button data-v="flash">Flashcards</button>
    <button data-v="mistakes">Mistakes</button>
  </nav>
</div></header>
<main id="main"></main>
<div class="snd" id="snd">
  <div class="sndp" id="pomp" hidden>
    <div style="font-weight:800">🍅 Pomodoro timer</div>
    <div class="pmode" id="pmode">Focus</div>

{id:"as1",t:"asex",s:"i",type:"mcq",q:"Which is the best definition of a <b>clone</b>?",
 o:["An organism that is genetically identical to its parent","An organism that looks very similar to its parents","Any offspring that was produced by fertilisation","Two offspring of the same parents born at the same time"],a:0,
 ex:"A clone has <b>identical genetic material</b> to its parent. “Looks similar” is not enough: brothers and sisters look similar but are not clones. Twins born together can be non-identical. Fertilisation always mixes genes, so it never makes a clone of a parent."},
{id:"as2",t:"asex",s:"i",type:"multi",q:"Select <b>ALL</b> the organisms that can reproduce <b>asexually</b> (in at least one way).",

 ex:"Bacteria split in two (binary fission). Potatoes grow new plants from tubers. Strawberries send out runners. Starfish can regrow a whole body from a broken arm that has part of the centre (fragmentation). Yeast buds. Humans and ladybirds only reproduce sexually. <b>Trap:</b> strawberries and starfish can reproduce BOTH ways."},
{id:"as3",t:"asex",s:"ii",type:"mcq",q:"Almost all bananas sold in shops are clones grown from pieces of one variety. A new fungus is now killing banana farms all over the world. What is the <b>best</b> scientific explanation?",
 o:["All the plants have identical genes, so if one plant cannot resist the fungus, none of them can","Asexual reproduction makes plants weaker and smaller than sexual reproduction","The fungus spreads faster because banana plants are planted close together","Cloned plants have no genes, so they cannot fight disease"],a:0,
 ex:"Clones have <b>no genetic variation</b>. In a population made by sexual reproduction, a few individuals might by chance have genes that help them survive the disease. With clones it is all or nothing. This has happened before: the Gros Michel banana was almost wiped out by Panama disease in the 1950s. Planting close together helps the disease spread, but it does not explain why <i>every</i> plant dies."},
{id:"as4",t:"asex",s:"i",type:"mcq",q:"Which of these is an advantage of <b>sexual</b> reproduction?",
 o:["Offspring show variation, so the species is more likely to survive if the environment changes","It is faster, so many offspring are produced quickly","Only one parent is needed, so no energy is spent finding a mate","Offspring are identical to a parent that is already well adapted"],a:0,
 ex:"Options 2, 3 and 4 are all advantages of <b>asexual</b> reproduction. Sexual reproduction is slower and needs a mate, but its big advantage is <b>variation</b>."},
{id:"as5",t:"asex",s:"ii",type:"mcq",q:"Aphids (small insects) reproduce <b>asexually</b> all summer when food is plentiful, then switch to <b>sexual</b> reproduction in autumn, before winter. Suggest why this strategy works well.",
 o:["Asexual reproduction quickly makes huge numbers to use the plentiful food; sexual reproduction creates variation just before conditions get harsh","Sexual reproduction is faster, which helps them survive the cold","Asexual reproduction only works in warm weather because clones need sunlight","They reproduce sexually in autumn so that all their offspring will be identical"],a:0,
 ex:"This is an <b>unfamiliar situation</b>: apply what you know. Asexual = fast, many offspring, good when the environment is stable and good. Sexual = variation, good when the environment is about to change. Winter is a big change, so variation raises the chance that <i>some</i> offspring survive."},
{id:"as6",t:"asex",s:"i",type:"mcq",q:"Why do offspring from sexual reproduction vary, even when they have the same two parents?",
 o:["Each offspring gets a different mix of genetic material from the two parents","Each offspring has more chromosomes than its parents","The mother decides which features each offspring gets","Offspring only get genes from one parent at a time"],a:0,
 ex:"Each gamete (sperm or egg) carries a different half of the parent’s genetic material. When two gametes fuse, the combination is new every time, so siblings differ. The exception is identical twins, who come from one zygote."},
{id:"as7",t:"asex",s:"i",type:"match",q:"Match each organism to the way it reproduces.",
 pairs:[["Bacterium","Splits into two identical cells"],["Potato","Grows new plants from tubers"],["Strawberry","Sends out runners AND makes seeds"],["Yeast","Grows a bud that breaks off"],["Human","Sexual reproduction only, with internal fertilisation"]],
 ex:"Only the strawberry does both here: runners = asexual (clones), seeds from flowers = sexual (variation)."},
{id:"as8",t:"asex",s:"ii",type:"written",q:"<b>Compare</b> asexual and sexual reproduction. Refer to the number of parents, gametes and the offspring produced. Give one example of each. <span class='mk'>[5 marks]</span>",
 marks:[{p:"Asexual has ONE parent; sexual usually has TWO parents",k:["one parent|single parent|1 parent","two parents|2 parents"]},
  {p:"Sexual involves gametes / fertilisation; asexual does not",k:["gamete|fertili[sz]|sperm|egg"]},
  {p:"Asexual offspring are genetically identical (clones); sexual offspring show variation",k:["identical|clone","vari|differ"]},
  {p:"Asexual is faster / needs no mate; sexual is slower / needs a mate (or: variation helps the species survive change)",k:["fast|quick|mate|slow|surviv"]},
  {p:"A correct example of each (e.g. bacteria / potato / strawberry runners; humans / ladybirds)",k:["bacteri|potato|strawberr|yeast|starfish|runner|tuber","human|ladybird|people|mammal|bird|dog|cat"]}],
 model:"Asexual reproduction needs only <b>one parent</b> and involves <b>no gametes or fertilisation</b>, so the offspring are <b>genetically identical clones</b>, for example bacteria splitting in two or a potato growing from a tuber. Sexual reproduction usually involves <b>two parents</b> whose <b>gametes</b> (sperm and egg) fuse at <b>fertilisation</b>, so the offspring get a mix of genetic material and show <b>variation</b>, for example humans or ladybirds. Asexual reproduction is faster and needs no mate, while sexual reproduction is slower but the variation means some offspring may survive if the environment changes."},
{id:"as9",t:"asex",s:"ii",type:"mcq",q:"A gardener has one rose bush with perfect flowers and wants 20 new bushes with <b>exactly</b> the same flowers. What should she do, and why?",
 o:["Take cuttings, because asexual reproduction produces clones with identical genes","Plant its seeds, because seeds come from the same parent so they are identical","Plant its seeds, because seeds are produced asexually","Take cuttings, because cuttings grow faster than seeds, so they will look better"],a:0,
 ex:"Seeds come from <b>sexual</b> reproduction (pollen + ovule), so they vary, especially if the pollen came from a different plant. Cuttings are <b>asexual</b>, so they are clones. Option 4 gives a true fact (cuttings are often quicker) but the wrong reason."},
{id:"as10",t:"asex",s:"ii",type:"mcq",q:"A newly discovered deep-sea fish lives where it very rarely meets another fish of its species. Scientists find it can reproduce asexually when no mate is found. Which is the best justification for why this helps it survive?",
 o:["It can still produce offspring without finding a mate, so the population does not die out, even though the offspring will have no variation","Asexual reproduction gives its offspring more variation for the deep sea","Its offspring will be stronger because they have two parents","It saves energy because it no longer needs to eat"],a:0,
 ex:"A good <b>justify</b> answer gives the benefit AND reasons with science: no mate is needed, so reproduction can happen at all. A top answer also mentions the cost (no variation)."},
// ---------------- HUMAN SYSTEMS ----------------
{id:"hu1",t:"human",s:"i",type:"order",q:"Put these in order to show the path of sperm from where they are made to leaving the body.",

{id:"hu2",t:"human",s:"i",type:"order",q:"Put these in order to show the path from where an egg is released to the outside of the body.",

{id:"hu3",t:"human",s:"i",type:"match",fig:"female",q:"Label the female reproductive system: match each letter to the correct structure.",

{id:"hu4",t:"human",s:"i",type:"match",fig:"male",q:"Label the male reproductive system: match each letter to the correct structure.",

{id:"hu5",t:"human",s:"i",type:"mcq",q:"Where does fertilisation normally happen in humans?",

 ex:"<b>Very common trap!</b> Fertilisation happens in the <b>oviduct</b>. The zygote then divides as it travels to the <b>uterus</b>, where <b>implantation</b> happens about a week later."},
{id:"hu6",t:"human",s:"i",type:"mcq",q:"What is the function of the <b>scrotum</b>?",

 ex:"Sperm are made best at about 2–3 °C below body temperature, so the testes hang outside the body in the scrotum. Fluid comes from the prostate and seminal vesicles. Testosterone is made by the <b>testes</b>, not the scrotum."},
{id:"hu7",t:"human",s:"i",type:"mcq",q:"What is the function of the <b>prostate gland</b> (and seminal vesicles)?",
 o:["Adds fluid containing nutrients to sperm, making semen","Makes sperm cells","Releases eggs","Carries sperm from the testes to the urethra"],a:0,
 ex:"The fluid gives sperm sugars for energy and a liquid to swim in. Sperm + fluid = <b>semen</b>. Sperm are made in the testes; the sperm duct carries them."},
{id:"hu8",t:"human",s:"i",type:"multi",q:"Select <b>ALL</b> the features that are adaptations of a <b>sperm cell</b>.",
 o:["A tail to swim","Lots of mitochondria to release energy","An acrosome in the head with enzymes to digest the egg’s outer layer","A large food store in the cytoplasm","A nucleus with half the normal number of chromosomes (23)","A cell wall for protection","A streamlined shape"],a:[0,1,2,4,6],
 ex:"The large food store belongs to the <b>egg</b>. No animal cell has a cell wall. Each adaptation links to a job: tail → swim; mitochondria → energy for swimming; acrosome enzymes → get into the egg; 23 chromosomes → zygote has 46; streamlined → moves easily."},
{id:"hu9",t:"human",s:"ii",type:"mcq",q:"A man’s sperm cells have mitochondria that do not work properly. <b>Predict</b> the effect and explain it.",
 o:["The sperm cannot release enough energy to swim to the egg, so fertilisation is less likely","The sperm will have the wrong number of chromosomes","The sperm cannot digest the egg’s outer layer because mitochondria make enzymes","He will not produce testosterone"],a:0,
 ex:"Mitochondria release energy (by respiration). The tail needs that energy to swim the long distance through the uterus to the oviduct. The acrosome, not the mitochondria, contains the enzymes."},
{id:"hu10",t:"human",s:"ii",type:"written",q:"<b>Explain</b> why an egg cell needs a large food store but a sperm cell does not. <span class='mk'>[4 marks]</span>",
 marks:[{p:"The egg’s food store gives energy/nutrients to the zygote/embryo as it divides",k:["energy|nutrient|food","zygote|embryo|divid|develop|grow"]},
  {p:"…for several days, until it implants in the uterus / before the placenta forms",k:["implant|placenta|uterus|days"]},
  {p:"Sperm only needs energy to swim for a short time, supplied by its mitochondria (and sugars in the semen)",k:["mitochond|semen|fluid"]},
  {p:"Sperm must be small / light / streamlined to swim; a food store would make it heavy and slow",k:["small|light|streamlin|heavy|slow"]}],
 model:"After fertilisation the zygote divides into an embryo while it travels down the oviduct for several days. It has no other food supply until it <b>implants</b> in the uterus lining and the placenta forms, so the egg’s large food store provides the <b>energy and nutrients</b> it needs. A sperm cell only needs energy to swim for a short time, which its many <b>mitochondria</b> release using sugars from the semen. A large food store would make the sperm <b>heavy and less streamlined</b>, so it would swim more slowly and be less likely to reach the egg."},
{id:"hu11",t:"human",s:"i",type:"mcq",q:"After one sperm enters the egg, the egg’s outer membrane changes. Why is this important?",
